<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stillroom</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='7' width='26' height='18' rx='3' fill='%23ff5a3c'/%3E%3Crect x='7' y='11' width='18' height='10' rx='1' fill='%23111'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to results</a>

  <header class="top">
    <a class="brand" href="/" data-link aria-label="Stillroom home">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Stillroom</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="/" data-link data-nav="search">Search</a>
      <a href="/films" data-link data-nav="films">Films</a>
      <a href="/boards" data-link data-nav="boards">Boards</a>
    </nav>
    <div class="top-right">
      <span class="stats" id="stats"></span>
      <button class="icon-btn" id="themeToggle" title="Toggle light / dark" aria-label="Toggle light or dark theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
    </div>
  </header>

  <section class="searchbar" id="searchbar">
    <h1 class="sr-only">Search film stills</h1>
    <form class="query" id="queryForm" role="search">
      <svg class="query-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Describe the frame you're looking for…" aria-label="Search stills by description">
      <kbd class="hint" aria-hidden="true">/</kbd>
    </form>
    <div class="tools">
      <button class="tool" id="filtersToggle" aria-expanded="true" aria-controls="facets">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        Filters <span class="badge" id="filterCount" hidden></span>
      </button>
      <div class="popover-wrap">
        <button class="tool" id="colorBtn" aria-haspopup="dialog" aria-expanded="false">
          <span class="swatch-dot" id="colorDot"></span> Colour
        </button>
        <div class="popover" id="colorPop" role="dialog" aria-label="Search by colour" hidden>
          <p class="pop-title">Find stills containing a colour</p>
          <div class="preset-colors" id="presetColors"></div>
          <label class="color-custom">Custom <input type="color" id="colorInput" value="#1f6f78"></label>
          <button class="link-btn" id="colorClear">Clear colour</button>
        </div>
      </div>
      <label class="tool sort">
        <span class="sr-only">Sort by</span>
        <select id="sort" aria-label="Sort results">
          <option value="">Best match</option>
          <option value="film">Film order</option>
          <option value="random">Shuffle</option>
          <option value="oldest">Oldest films</option>
          <option value="newest">Newest films</option>
        </select>
      </label>
      <button class="tool" id="shuffleBtn" title="Shuffle the results">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        Shuffle
      </button>
    </div>
    <div class="chips" id="activeChips" aria-live="polite"></div>
  </section>

  <div class="layout" id="layout">
    <aside class="facets" id="facets" aria-label="Filters"></aside>
    <main id="main" tabindex="-1">
      <div class="result-head" id="resultHead" aria-live="polite"></div>
      <div class="grid" id="grid"></div>
      <div class="sentinel" id="sentinel"></div>
      <div class="empty" id="empty" hidden></div>
    </main>
  </div>

  <section class="page" id="filmsPage" hidden>
    <div class="page-head"><h1>Films</h1><p class="muted" id="filmsSub"></p></div>
    <div class="cards" id="filmCards"></div>
  </section>

  <section class="page" id="boardsPage" hidden>
    <div class="page-head">
      <h1>Boards</h1>
      <form class="inline-form" id="newBoardForm">
        <input id="newBoardName" placeholder="New board name" aria-label="New board name" maxlength="120">
        <button class="btn primary">Create board</button>
      </form>
    </div>
    <div class="cards" id="boardCards"></div>
  </section>

  <section class="page" id="boardPage" hidden>
    <div class="page-head">
      <div>
        <a href="/boards" data-link class="muted back">← All boards</a>
        <h1 id="boardTitle"></h1>
        <p class="muted" id="boardSub"></p>
      </div>
      <div class="head-actions">
        <button class="btn" id="boardRename">Rename</button>
        <a class="btn" id="boardExport" href="#">Export .zip</a>
        <button class="btn danger" id="boardDelete">Delete</button>
      </div>
    </div>
    <div class="grid" id="boardGrid"></div>
    <div class="empty" id="boardEmpty" hidden>This board is empty. Open any still and press <kbd>S</kbd> to save it here.</div>
  </section>

  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Still details" hidden>
    <div class="viewer-stage">
      <button class="nav-arrow prev" id="vPrev" aria-label="Previous still">‹</button>
      <img id="vImg" alt="">
      <button class="nav-arrow next" id="vNext" aria-label="Next still">›</button>
      <div class="viewer-count" id="vCount"></div>
    </div>
    <aside class="viewer-panel" id="vPanel">
      <button class="icon-btn close" id="vClose" aria-label="Close (Esc)">✕</button>
      <div id="vBody"></div>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
