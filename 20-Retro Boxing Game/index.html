<body>
<title>Knockout Alley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one 320x224 16-bit ring view set in a dark cabinet, controls legend below, touch pad on phones */
:root{
  --cabinet:#120c1a;
  --bezel:#2c2040;
  --ink:#06040a;
  --text:#ece6f4;
  --dim:#8c80a8;
  --red:#e02860;
  --gold:#f8c820;
  --font-pixel:"Press Start 2P", ui-monospace, "Courier New", monospace;
  color-scheme: dark;
}
html,body{height:100%}
body{background:var(--cabinet);color:var(--text);font-family:var(--font-pixel)}
.wrap{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-inline:16px;padding-block:16px}
.marquee{margin:0;font-size:clamp(14px,3.2vw,22px);font-weight:400;letter-spacing:.08em;color:var(--gold);text-shadow:2px 2px 0 var(--red),4px 4px 0 var(--ink);text-align:center;text-wrap:balance}
.screen{position:relative;background:#000;padding:10px;border-radius:14px;box-shadow:inset 0 0 0 3px var(--bezel),0 0 0 6px var(--ink);max-width:100%;box-sizing:border-box}
.screen::after{content:"";position:absolute;inset:10px;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.12) 2px,rgba(0,0,0,.12) 3px)}
canvas{display:block;width:640px;max-width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;outline:none;cursor:pointer}
canvas:focus-visible{box-shadow:0 0 0 2px var(--gold)}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 24px;max-width:760px;font-size:9px;line-height:2;color:var(--dim)}
.legend span{white-space:nowrap}
kbd{font-family:inherit;font-size:8px;color:var(--ink);background:var(--text);padding:2px 5px;border-radius:2px;box-shadow:0 2px 0 var(--dim)}
.pad{display:none;width:100%;max-width:560px;justify-content:space-between;align-items:center;gap:12px;user-select:none;-webkit-user-select:none;touch-action:none}
.cluster{display:flex;gap:8px;align-items:center}
.pad button{font-family:inherit;font-size:10px;color:var(--text);background:var(--bezel);border:0;border-radius:50%;width:46px;height:46px;box-shadow:0 4px 0 var(--ink);touch-action:none}
.pad button:active,.pad button.on{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pad .dir{border-radius:8px;width:38px;height:38px}
.dpad{display:grid;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,38px);gap:2px;flex:none}
.d-up{grid-area:1/2}.d-left{grid-area:2/1}.d-right{grid-area:2/3}.d-down{grid-area:3/2}
.pad .cluster{flex-wrap:wrap;justify-content:flex-end;max-width:216px;gap:6px}
.pad .b-dodge,.pad .b-duck{background:#5c3c90}
.pad .b-duck{background:#5c3c90}
.pad .b-body{background:#c06018}
.pad .b-block{background:#2850b0}
.pad .b-jab{background:var(--red)}
.pad .b-hook{background:#a01830}
.pad .b-star{background:var(--gold);color:var(--ink)}
.sys{display:none;gap:12px}
.sys button{font-family:inherit;font-size:8px;color:var(--dim);background:transparent;border:2px solid var(--bezel);border-radius:12px;padding:6px 12px}
@media (pointer:coarse){.pad,.sys{display:flex}.legend{display:none}}
@media (prefers-reduced-motion:reduce){.pad button{transition:none}}
</style>

<div class="wrap">
  <h1 class="marquee">KNOCKOUT ALLEY</h1>
  <div class="screen"><canvas id="game" width="320" height="224" tabindex="0" aria-label="Knockout Alley game screen"></canvas></div>
  <div class="pad" id="pad">
    <div class="dpad">
      <button class="dir d-up" data-k="up" aria-label="Step in">&#9650;&#xFE0E;</button>
      <button class="dir d-left" data-k="left" aria-label="Move left">&#9664;&#xFE0E;</button>
      <button class="dir d-right" data-k="right" aria-label="Move right">&#9654;&#xFE0E;</button>
      <button class="dir d-down" data-k="down" aria-label="Step back">&#9660;&#xFE0E;</button>
    </div>
    <div class="cluster">
      <button class="b-dodge" data-k="dodgeL" aria-label="Dodge left">&laquo;</button>
      <button class="b-duck" data-k="duck" aria-label="Duck">DCK</button>
      <button class="b-dodge" data-k="dodgeR" aria-label="Dodge right">&raquo;</button>
      <button class="b-block" data-k="block" aria-label="Block">BLK</button>
      <button class="b-body" data-k="body" aria-label="Body punch">BDY</button>
      <button class="b-star" data-k="star" aria-label="Star punch">&#9733;&#xFE0E;</button>
      <button class="b-hook" data-k="hook" aria-label="Hook">HOOK</button>
      <button class="b-jab" data-k="jab" aria-label="Jab">JAB</button>

  </div>
  <div class="sys">
    <button data-k="start" id="b-start">START</button>
    <button data-k="mute" id="b-mute">SOUND</button>
    <button data-k="read" id="b-read">READ ALOUD</button>

  <div class="legend">
    <span><kbd>&larr;</kbd> <kbd>&uarr;</kbd> <kbd>&darr;</kbd> <kbd>&rarr;</kbd> MOVE</span>
    <span><kbd>A</kbd> <kbd>D</kbd> DODGE</span>

    <span><kbd>SPACE</kbd> STAR PUNCH</span>
    <span><kbd>ENTER</kbd> START</span>
    <span><kbd>P</kbd> PAUSE</span>
    <span><kbd>M</kbd> SOUND</span>
    <span><kbd>R</kbd> READ ALOUD</span>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 320, H = 224, S = 1.5, FLOOR = 148, GROUND = 200, Y_MIN = 162, Y_MAX = 214;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* ---------- screen fit ---------- */
function fit() {
  const availW = Math.min(window.innerWidth - 52, 1300);
  const coarse = matchMedia('(pointer:coarse)').matches;
  const availH = window.innerHeight - (coarse ? 260 : 190);
  const s = Math.floor(Math.min(availW / W, Math.max(availH, H) / H));
  cv.style.width = (s >= 2 ? W * s : Math.max(200, Math.min(availW, W * 2))) + 'px';
}
addEventListener('resize', fit); fit();

/* ---------- input ---------- */
const held = {}, pressed = {};
const KEYMAP = {
  ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down',
  KeyA:'dodgeL', KeyQ:'dodgeL', KeyD:'dodgeR', KeyE:'dodgeR', KeyS:'duck', ShiftLeft:'duck', ShiftRight:'duck',
  KeyC:'body', KeyV:'block',
  KeyZ:'jab', KeyJ:'jab', KeyX:'hook', KeyK:'hook',
  Space:'star', KeyL:'star', Enter:'start', KeyP:'pause', Escape:'pause', KeyM:'mute', KeyR:'read'
};
function press(a){ if(!held[a]) pressed[a] = true; held[a] = true; }
addEventListener('keydown', e => {
  const a = KEYMAP[e.code]; if(!a) return;
  e.preventDefault(); audioInit(); press(a);
});
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if(a) held[a] = false; });
addEventListener('blur', () => { for (const k in held) held[k] = false; });
cv.addEventListener('pointerdown', () => { audioInit(); cv.focus(); pressed.start = true; });
document.querySelectorAll('[data-k]').forEach(b => {
  const k = b.dataset.k;
  const up = () => { held[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); audioInit(); press(k); b.classList.add('on');
    try { b.setPointerCapture(e.pointerId); } catch(_) {}
  });
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up);
  b.addEventListener('lostpointercapture', up);
  b.addEventListener('contextmenu', e => e.preventDefault());
});

/* ---------- audio ---------- */
let actx = null, master = null, muted = false, noiseBuf = null;
function audioInit() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.22; master.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (_) { actx = null; }
}
function toneAt(freq, dur, type, vol, t, slide) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function tone(freq, dur, type = 'square', vol = 0.2, slide = 0, when = 0) {
  if (actx) toneAt(freq, dur, type, vol, actx.currentTime + when, slide);
}
function noiseAt(t, dur, vol, freq, ftype = 'bandpass') {
  if (!actx) return;
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; f.type = ftype; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
}
function noise(dur, vol = 0.3, freq = 1000, when = 0) { if (actx) noiseAt(actx.currentTime + when, dur, vol, freq); }
const sfx = {
  swing(){ noise(0.05, 0.12, 3000); },
  hit(){ noise(0.08, 0.5, 900); tone(160, 0.08, 'square', 0.18, -80); },
  big(){ noise(0.2, 0.6, 400); tone(110, 0.25, 'sawtooth', 0.25, -60); },
  block(){ tone(1000, 0.035, 'square', 0.1); tone(700, 0.05, 'square', 0.1, 0, 0.035); },
  star(){ [880, 1175, 1568, 2093].forEach((f, i) => tone(f, 0.07, 'square', 0.12, 0, i * 0.05)); },
  thud(){ noise(0.15, 0.4, 200); tone(70, 0.15, 'triangle', 0.3, -30); },
  bell(){ [0, 0.28].forEach(w => { tone(1318, 0.5, 'triangle', 0.3, 0, w); tone(1975, 0.35, 'sine', 0.12, 0, w); }); },
  ko(){ [523, 440, 349, 262, 196].forEach((f, i) => tone(f, 0.16, 'square', 0.14, 0, i * 0.13)); },
  fanfare(){ [[523,0],[659,.12],[784,.24],[1047,.36],[784,.6],[1047,.72]].forEach(([f,w]) => tone(f, 0.2, 'square', 0.13, 0, w)); },
  pause(){ tone(988, 0.06, 'square', 0.1); tone(1319, 0.08, 'square', 0.1, 0, 0.07); },
  coin(){ tone(988, 0.05, 'square', 0.12); tone(1319, 0.12, 'square', 0.12, 0, 0.05); },
  eat(){ [523, 659, 784].forEach((f, i) => tone(f, 0.06, 'triangle', 0.2, 0, i * 0.05)); },
  thunk(){ noise(0.06, 0.35, 500); tone(200, 0.06, 'square', 0.12, -60); },
  crash(){ noise(0.25, 0.55, 700); noise(0.18, 0.3, 2500, 0.04); tone(150, 0.15, 'sawtooth', 0.15, -80); },
  buy(){ [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.06, 'square', 0.12, 0, i * 0.04)); },
  nope(){ tone(150, 0.15, 'square', 0.15); },
  tick(){ tone(660, 0.03, 'square', 0.08); },
  count(){ tone(880, 0.12, 'square', 0.12); tone(440, 0.12, 'triangle', 0.15); },
  crowd(){ noise(1.4, 0.22, 700); noise(1.0, 0.12, 2200, 0.1); }
};

/* house-and-funk sequencer: 32 sixteenth-note steps with kick, snare, hats, bass and lead */
const mtof = n => 440 * Math.pow(2, (n - 69) / 12);
const SONGS = [
  { bpm: 124,
    bass:[40,0,52,0, 40,40,0,52, 0,40,50,0, 52,0,47,0, 36,0,48,0, 36,36,0,48, 38,0,50,0, 38,0,43,45],
    lead:[0,0,0,0, 64,0,67,0, 0,71,0,69, 0,67,0,64, 0,0,0,0, 64,0,67,0, 0,72,0,71, 0,69,0,67] },
  { bpm: 130,
    bass:[45,0,57,45, 0,45,57,0, 45,0,55,0, 57,0,55,52, 41,0,53,41, 0,41,53,0, 43,0,55,0, 43,47,50,55],
    lead:[76,0,0,74, 0,76,0,79, 0,0,76,0, 74,0,72,0, 72,0,0,71, 0,72,0,74, 0,0,71,0, 67,0,69,0] },
  { bpm: 140,
    bass:[38,38,50,38, 38,50,38,48, 36,36,48,36, 36,48,36,46, 34,34,46,34, 34,46,34,45, 33,33,45,33, 45,33,44,45],
    lead:[62,0,65,0, 69,0,67,65, 0,64,0,62, 0,0,60,0, 62,0,65,0, 70,0,69,67, 0,65,0,64, 0,62,61,0] }
];
let song = null, songStep = 0, nextNote = 0;
function playSong(i){ song = SONGS[i]; songStep = 0; if (actx) nextNote = actx.currentTime + 0.08; }
function stopSong(){ song = null; }
setInterval(() => {
  if (!actx || !song) return;
  if (nextNote < actx.currentTime - 0.5) nextNote = actx.currentTime + 0.05;
  const step = 60 / song.bpm / 4;
  while (nextNote < actx.currentTime + 0.15) {
    const s = songStep % 32, L = song.lead[s], B = song.bass[s], t = nextNote;
    if (B) toneAt(mtof(B), step * 1.6, 'sawtooth', 0.09, t);
    if (L) { toneAt(mtof(L), step * 1.9, 'square', 0.045, t); toneAt(mtof(L) * 1.005, step * 1.9, 'square', 0.03, t); }
    if (s % 4 === 0) toneAt(140, 0.14, 'sine', 0.55, t, -100);
    if (s % 8 === 4) { noiseAt(t, 0.12, 0.28, 1800); toneAt(190, 0.06, 'triangle', 0.15, t); }
    if (s % 4 === 2) noiseAt(t, 0.04, 0.07, 7000, 'highpass');
    nextNote += step; songStep++;
  }
}, 25);

/* ---------- data ---------- */
const OUT = '#140c1c';
const SK = { a:'#f0b088', b:'#c88058', c:'#8c5434' };
const pal = (skin, o) => Object.assign({ skin: SK[skin], hair:null, hairStyle:'short', shirt:null, belt:'#3c2418', shoes:'#202028' }, o);

/* your punches: frames of wind-up, contact and recovery */
const PMOVES = {

const OMOVES = {

const OPPONENTS = [

  { name:'SPEEDY RICO', foot:1.5, range:66, circle:34, record:'14-6', from:'EAST SIDE', quote:"YOU CAN'T HIT WHAT YOU CAN'T SEE!", bulk:0, hp:90, power:0.85, tell:1.15, aggro:0.04, cool:[50,100],
    moves:['jab','jab','rush','hookL','hookR'], guard:{ high:4, low:3, open:2 }, chain:3, taunt:0.003,
    pal: pal('a', { hair:'#f040a0', hairStyle:'mohawk', vest:'#282830', pants:'#e8b820', shoes:'#ececec', gloves:'#f0d020' }) },
  { name:'BIG TONY', foot:0.7, range:48, circle:6, record:'19-4', from:'THE DOCKS', quote:"I DON'T DODGE. I DON'T NEED TO.", bulk:2, hp:120, power:1.25, tell:1.15, aggro:0.03, cool:[60,120],
    moves:['hookL','hookR','body','upper','jab'], guard:{ high:3, low:5, open:2 }, chain:4, taunt:0.002,
    pal: pal('c', { hairStyle:'bald', beard:'#201010', vest:'#6c4428', pants:'#44444c', gloves:'#282828' }) },

];

/* gym upgrades bought with fight purses */

  R(0, y0, W, 2, '#f8c820'); R(0, y0 + 70, W, 2, '#f8c820');
  lines.forEach(([s, c, size], i) => txt(s, W / 2, y0 + 10 + i * 18, c, 'center', size || 8));
}
function drawArena(){
  drawRing();
  const o = opp;
  ctx.save();
  if (shakeT > 0) ctx.translate((Math.random() * 2 - 1) * shakeMag | 0, (Math.random() * 2 - 1) * shakeMag | 0);
  const op = proj(o.x, o.z), ou = 2 * op.k;
  if (o.state === 'down') drawFrontDown(o.pal, o.bulk, Math.round(op.x), Math.round(op.y - 4 * op.k), ou);
  else drawFront(o.pal, o.bulk, frontPose(o), Math.round(op.x), Math.round(op.y), ou);
  if (count) drawRef(272, 186, count.t < 12 && count.t >= 0);
  drawBack(player, Math.round(160 + (player.x - camX) * 1.5), PL_Y);
  // range cue: dim chevrons when your punches can't reach
  if (state === 'fight' && !count && (o.z - player.z > REACH || Math.abs(o.x - player.x) > LANE)) {
    const a = (frameN >> 4) & 1 ? '#f8d020' : '#8c6c10', dir = o.x - player.x;
    if (Math.abs(dir) > LANE) txt(dir > 0 ? '>' : '<', dir > 0 ? W - 14 : 14, 120, a, 'center', 16);
    else txt('^', 160, 58, a, 'center', 16);
  }
  for (const s of sparks) drawSpark(s);
  for (const q of parts) R(Math.round(q.x), Math.round(q.y), q.sz || 2, q.sz || 2, q.c);
  ctx.restore();
  if (hurtFlash > 0) { ctx.fillStyle = 'rgba(255,40,60,' + hurtFlash * 0.03 + ')'; ctx.fillRect(0, 0, W, H); }
  for (const f of floats) txt(f.s, Math.round(f.x), Math.round(f.y), f.c, 'center');
  drawHUD();
}
function drawFighterCard(x, fi, sel, face){
  if (sel) { ctx.fillStyle = 'rgba(255,240,180,.14)'; ctx.beginPath(); ctx.ellipse(x, 168, 46, 10, 0, 0, 7); ctx.fill(); }
  const P = { ox:0, oy:(frameN >> 4) & 1, hx:0, hy:0, gl:{ x:-6, y:-54, s:8 }, gr:{ x:6, y:-54, s:8 }, face: face || 'normal' };
  if (sel) { P.gl = { x:-15, y:-72, s:8 }; P.gr = { x:15, y:-72, s:8 }; P.face = 'grin'; }
  drawFront(fi.pal, fi.bulk, P, x, 168, U, { robe:true });
  if (!sel) { ctx.fillStyle = 'rgba(12,6,24,.5)'; ctx.fillRect(x - 46, 26, 92, 144); }
}
function render(){
  switch (state) {
    case 'title': {
      fightIdx = 5; const o0 = opp; opp = null; camX = 0; player.z = 30; drawRing(); opp = o0;
      const ph = frameN % 120, P = frontPose({ state: ph > 60 && ph < 80 ? 'strike' : ph > 40 && ph <= 60 ? 'tell' : 'guard', t: ph > 60 ? ph - 60 : ph - 40, move:'hookL', tellLen:20, guard:'high', alt:false, flashT:0 });
      drawFront(OPPONENTS[5].pal, 3, P, OPP_X, OPP_Y);
      drawBack({ pal:GOLDIE_PAL, state: ph > 58 && ph < 84 ? 'dodge' : 'guard', t: ph - 58, dodgeDir: 1, flashT:0 }, 160, PL_Y);
      ctx.fillStyle = 'rgba(12,6,24,.5)'; ctx.fillRect(0, 0, W, 96);
      bigTitle('KNOCKOUT', 14, 24); bigTitle('ALLEY', 44, 24);
      txt('WORLD BOXING CIRCUIT', W / 2, 76, '#90d8f8', 'center');
      if ((frameN >> 5) & 1) txt('PRESS START', W / 2, 112, '#fcfcfc', 'center');
      txt('HI ' + String(hiscore).padStart(6, '0'), W / 2, 4, '#f8c820', 'center');
      fightIdx = 0;
      return;
    }
    case 'select': {
      patFill(PAT.brickDark, 0, 0, 0, W, 170); ctx.fillStyle = 'rgba(8,4,16,.5)'; ctx.fillRect(0, 0, W, 170);
      patFill(PAT.clubFloor, 0, 0, 170, W, 54); R(0, 170, W, 2, '#24203a');
      bigTitle('SELECT FIGHTER', 6, 16);
      FIGHTERS.forEach((fi, i) => {
        const cx = 80 + i * 160, sel = i === pick;
        drawFighterCard(cx, fi, sel);
        drawFace(cx - 10, 174, fi.pal);
        txt(fi.full, cx, 194, sel ? '#f8d020' : '#8c84a0', 'center');
        txt(fi.tag, cx, 204, sel ? '#90d8f8' : '#5c5470', 'center');
        if (sel) [['PWR', 0], ['HP', 1], ['SPD', 2]].forEach(([lab, k], j) => {
          txt(lab, cx + (i ? -150 : 50), 40 + j * 11, '#a8a0c0');
          for (let q = 0; q < 5; q++) R(cx + (i ? -118 : 82) + q * 9, 41 + j * 11, 7, 6, q < fi.stats[k] ? '#f8d020' : '#3c3048');
        });
      });
      if ((frameN >> 5) & 1) txt('LEFT/RIGHT   JAB TO FIGHT', W / 2, 216, '#fcfcfc', 'center');
      return;
    }
    case 'vs': {
      const T = opp.T;
      R(0, 0, W, H, '#140c24');
      for (let i = 0; i < 14; i++) { ctx.fillStyle = i & 1 ? '#1c1030' : '#24143c'; ctx.beginPath(); ctx.moveTo(220, 120); const a = i / 14 * Math.PI * 2 + frameN / 200, a2 = a + Math.PI / 14; ctx.lineTo(220 + Math.cos(a) * 400, 120 + Math.sin(a) * 400); ctx.lineTo(220 + Math.cos(a2) * 400, 120 + Math.sin(a2) * 400); ctx.fill(); }
      drawFront(opp.pal, opp.bulk, { ox:0, oy:(frameN >> 4) & 1, hx:0, hy:0, gl:{ x:-15, y:-40, s:8 }, gr:{ x:15, y:-40, s:8 }, face:'angry' }, 228, 214);
      txt(CIRCUITS[fightIdx], 12, 14, '#90d8f8');
      txt('FIGHT ' + (fightIdx + 1) + ' OF ' + OPPONENTS.length, 12, 26, '#8c84a0');
      txt('VS.', 12, 50, '#ff3060', 'left', 16);
      txt(T.name, 12, 82, '#f8d020', 'left', 16);
      txt('RECORD  ' + T.record, 12, 108, '#fcfcfc');
      txt('FROM    ' + T.from, 12, 120, '#fcfcfc');
      const words = ('"' + T.quote + '"').split(' '); let line = '', ly = 144;
      for (const w of words) { if ((line + ' ' + w).length > 18) { txt(line, 12, ly, '#e8a0c0'); ly += 11; line = w; } else line = line ? line + ' ' + w : w; }
      txt(line, 12, ly, '#e8a0c0');
      if (timer > 30 && (frameN >> 5) & 1) txt('PRESS START', 12, 206, '#fcfcfc');
      return;
    }
    case 'shop': return drawShop();
    case 'victory': {
      fightIdx = 5; const o0 = opp; opp = null; camX = 0; player.z = 30; drawRing(); opp = o0;
      drawFront(player.pal, player.bulk, { ox:0, oy:(frameN >> 4) & 1, hx:0, hy:0, gl:{ x:-15, y:-72, s:8 }, gr:{ x:15, y:-72, s:8 }, face:'grin' }, 160, 178, U, { robe:true });
      box(136, 120, 48, 12, '#f8c820'); box(150, 117, 20, 18, '#fce060'); R(156, 121, 8, 10, '#e02838');
      for (const q of parts) R(Math.round(q.x), Math.round(q.y), 2, 2, q.c);
      overlayCard([['WORLD CHAMPION!', '#f8d020', 16], [FIGHTERS[pick].full, '#fcfcfc'], ['FINAL ' + String(score).padStart(6, '0'), '#90d8f8']], 4);
      if (timer > 120 && (frameN >> 5) & 1) txt('PRESS START', W / 2, 212, '#fcfcfc', 'center');
      return;
    }
  }
  // in the ring
  drawArena();
  if (state === 'roundStart') overlayCard([['ROUND ' + round, '#f8d020', 16], [timer > 70 ? 'FIGHT!' : 'VS ' + opp.T.name, '#fcfcfc']]);
  if (state === 'fight' && count) {
    if (count.n > 0) txt(String(count.n), 160, 64, '#fcfcfc', 'center', 24);
    if (count.who === 'player' && !count.tko) {
      const need = 100 + (player.kd - 1) * 35;
      R(80, 190, 160, 10, OUT); R(81, 191, Math.round(158 * Math.min(1, player.getUp / need)), 8, '#58f898');
      if ((frameN >> 3) & 1) txt('MASH PUNCH TO GET UP!', 160, 176, '#f8d020', 'center');
    }
  }
  if (state === 'corner') {
    const L1 = 'ROUND ' + (round + 1) + ' NEXT', tip = TIPS[tipIdx];
    overlayCard([[L1, '#f8d020', 16], ['COACH SAYS:', '#90d8f8'], [tip.length > 38 ? tip.slice(0, tip.lastIndexOf(' ', 38)) : tip, '#fcfcfc'], [tip.length > 38 ? tip.slice(tip.lastIndexOf(' ', 38) + 1) : '', '#fcfcfc']], 68);
  }
  if (state === 'result') {
    const r = result;
    overlayCard([[r.win ? r.how + ' WIN!' : r.how + ' LOSS', r.win ? '#f8d020' : '#ff3060', 16],
      [r.win ? 'PURSE $' + r.purse : opp.T.name + ' WINS', '#fcfcfc'],
      [timer > 90 && (frameN >> 5) & 1 ? 'PRESS START' : 'POINTS ' + pPts + ' - ' + oPts, '#90d8f8']]);
  }
  if (state === 'lost') overlayCard([['REMATCH?', '#ff3060', 16], ['TRAIN UP AND TRY AGAIN', '#fcfcfc'], [(frameN >> 5) & 1 ? 'PRESS START' : '', '#90d8f8']]);
  if (paused) overlayCard([['PAUSE', '#fcfcfc', 16], ['P TO RESUME', '#90d8f8']]);
  if (muted) txt('SOUND OFF', W - 6, 214, '#8c84a0', 'right');
}
function drawShop(){
  patFill(PAT.brickDark, 0, 0, 0, W, 172);
  ctx.fillStyle = 'rgba(8,4,16,.45)'; ctx.fillRect(0, 0, W, 172);
  patFill(PAT.clubFloor, 0, 0, 172, W, 52); R(0, 172, W, 2, '#24203a');
  R(26, 0, 2, 40, '#686878'); box(16, 40, 22, 52, '#a01828'); R(16, 50, 22, 3, '#2c2438'); R(16, 80, 22, 3, '#2c2438');
  bigTitle('THE GYM', 8, 16);
  txt('$' + money, W - 8, 10, '#68e060', 'right');
  drawFront(player.pal, player.bulk, { ox:0, oy:(frameN >> 4) & 1, hx:0, hy:0, gl:{ x:-6, y:-54, s:8 }, gr:{ x:6, y:-54, s:8 }, face:'normal' }, 76, 168, 1.5);
  txt('NEXT: ' + OPPONENTS[fightIdx + 1].name, 76, 178, '#f8d020', 'center');
  txt(CIRCUITS[fightIdx + 1], 76, 190, '#8c84a0', 'center');
  UPGRADES.forEach((u, i) => {
    const y = 34 + i * 18, sel = i === shopSel;
    if (sel) { R(132, y - 5, 182, 16, 'rgba(60,40,100,.85)'); R(132, y - 5, 2, 16, '#f8c820'); }
    txt(u.name, 140, y, sel ? '#fcfcfc' : '#a8a0c0');
    if (u.max) for (let k = 0; k < u.max; k++) box(232 + k * 6, y + 1, 4, 5, k < player.up[u.key] ? '#f8c820' : '#3c3048');
    const c = u.key === 'leave' ? null : upCost(u);
    if (u.key !== 'leave') txt(c == null ? 'MAX' : '$' + c, W - 8, y, c == null ? '#8c84a0' : money >= c ? '#68e060' : '#c02838', 'right');
  });
  txt(UPGRADES[shopSel].info, 228, 168, '#90d8f8', 'center');
  if (shopMsg) txt(shopMsg[0], 228, 184, shopMsg[1], 'center');
  txt('UP/DOWN PICK  JAB BUY', 228, 204, '#8c84a0', 'center');
}

/* ---------- loop ---------- */
player = makePlayer(FIGHTERS[0]);
let acc = 0, last = performance.now();
const STEP = 1000 / 60;
function frame(now){
  acc += Math.min(100, now - last); last = now;
  let ran = false;
  while (acc >= STEP) { update(); acc -= STEP; if (!ran) { for (const k in pressed) pressed[k] = false; ran = true; } }
  renderN++;
  render();
  if (renderN % 60 === 0) for (const [k, b] of textBoxes) if (renderN - b.seen > 90) textBoxes.delete(k);
  if (readAloud && hoverBox && renderN - hoverBox.seen <= 45) {
    const b = hoverBox; ctx.fillStyle = (frameN >> 3) & 1 ? '#f8d020' : '#fcf8b0';
    ctx.fillRect(Math.round(b.x), Math.round(b.y + b.h + 2), Math.round(b.w), 1);
  }
  if (readToast > 0) {
    readToast--;
    const msg = readAloud ? 'READ ALOUD ON' : 'READ ALOUD OFF';
    ctx.fillStyle = 'rgba(12,6,24,.85)'; ctx.fillRect(4, 202, 118, 16);
    txt(msg, 10, 206, readAloud ? '#58f898' : '#8c84a0');
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
