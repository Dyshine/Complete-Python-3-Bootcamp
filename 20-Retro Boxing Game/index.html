<!doctype html>
<html lang="en">

<body>
<title>Knockout Alley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one 320x224 16-bit screen set in a dark cabinet, controls legend below, touch pad on phones */
:root{
  --cabinet:#120c1a;
  --bezel:#2c2040;
  --ink:#06040a;
  --text:#ece6f4;
  --dim:#8c80a8;
  --red:#e02860;
  --gold:#f8c820;
  --font-pixel:"Press Start 2P", ui-monospace, "Courier New", monospace;
  color-scheme: dark;
}
html,body{height:100%}
body{background:var(--cabinet);color:var(--text);font-family:var(--font-pixel)}
.wrap{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-inline:16px;padding-block:16px}
.marquee{margin:0;font-size:clamp(14px,3.2vw,22px);font-weight:400;letter-spacing:.08em;color:var(--gold);text-shadow:2px 2px 0 var(--red),4px 4px 0 var(--ink);text-align:center;text-wrap:balance}
.screen{position:relative;background:#000;padding:10px;border-radius:14px;box-shadow:inset 0 0 0 3px var(--bezel),0 0 0 6px var(--ink);max-width:100%;box-sizing:border-box}
.screen::after{content:"";position:absolute;inset:10px;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.12) 2px,rgba(0,0,0,.12) 3px)}
canvas{display:block;width:640px;max-width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;outline:none;cursor:pointer}
canvas:focus-visible{box-shadow:0 0 0 2px var(--gold)}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 24px;max-width:760px;font-size:9px;line-height:2;color:var(--dim)}
.legend span{white-space:nowrap}
kbd{font-family:inherit;font-size:8px;color:var(--ink);background:var(--text);padding:2px 5px;border-radius:2px;box-shadow:0 2px 0 var(--dim)}
.pad{display:none;width:100%;max-width:560px;justify-content:space-between;align-items:center;gap:12px;user-select:none;-webkit-user-select:none;touch-action:none}
.cluster{display:flex;gap:8px;align-items:center}
.pad button{font-family:inherit;font-size:11px;color:var(--text);background:var(--bezel);border:0;border-radius:50%;width:56px;height:56px;box-shadow:0 4px 0 var(--ink);touch-action:none}
.pad button:active,.pad button.on{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pad .dir{border-radius:8px;width:44px;height:44px}
.dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:2px}
.d-up{grid-area:1/2}.d-left{grid-area:2/1}.d-right{grid-area:2/3}.d-down{grid-area:3/2}
.pad .cluster{flex-wrap:wrap;justify-content:flex-end;max-width:132px}
.pad .b-block{background:#2850b0}
.pad .b-jab{background:var(--red)}
.pad .b-hook{background:#a01830}
.pad .b-star{background:var(--gold);color:var(--ink)}
.sys{display:none;gap:12px}
.sys button{font-family:inherit;font-size:8px;color:var(--dim);background:transparent;border:2px solid var(--bezel);border-radius:12px;padding:6px 12px}
@media (pointer:coarse){.pad,.sys{display:flex}.legend{display:none}}
@media (prefers-reduced-motion:reduce){.pad button{transition:none}}
</style>

<div class="wrap">
  <h1 class="marquee">KNOCKOUT ALLEY</h1>
  <div class="screen"><canvas id="game" width="320" height="224" tabindex="0" aria-label="Knockout Alley game screen"></canvas></div>
  <div class="pad" id="pad">
    <div class="dpad">
      <button class="dir d-up" data-k="up" aria-label="Move up">&#9650;&#xFE0E;</button>
      <button class="dir d-left" data-k="left" aria-label="Move left">&#9664;&#xFE0E;</button>
      <button class="dir d-right" data-k="right" aria-label="Move right">&#9654;&#xFE0E;</button>
      <button class="dir d-down" data-k="down" aria-label="Move down">&#9660;&#xFE0E;</button>
    </div>
    <div class="cluster">
      <button class="b-block" data-k="block" aria-label="Block">BLK</button>
      <button class="b-star" data-k="star" aria-label="Star punch">&#9733;&#xFE0E;</button>
      <button class="b-hook" data-k="hook" aria-label="Uppercut">UPP</button>
      <button class="b-jab" data-k="jab" aria-label="Jab">JAB</button>
    </div>
  </div>
  <div class="sys">
    <button data-k="start" id="b-start">START</button>
    <button data-k="mute" id="b-mute">SOUND</button>
  </div>
  <div class="legend">
    <span><kbd>&larr;</kbd> <kbd>&uarr;</kbd> <kbd>&darr;</kbd> <kbd>&rarr;</kbd> MOVE</span>
    <span><kbd>C</kbd> BLOCK</span>
    <span><kbd>Z</kbd> JAB</span>
    <span><kbd>X</kbd> UPPERCUT</span>
    <span><kbd>SPACE</kbd> STAR PUNCH</span>
    <span><kbd>ENTER</kbd> START</span>
    <span><kbd>P</kbd> PAUSE</span>
    <span><kbd>M</kbd> SOUND</span>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 320, H = 224, S = 1.5, FLOOR = 148, GROUND = 200, Y_MIN = 162, Y_MAX = 214;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* ---------- screen fit ---------- */
function fit() {
  const availW = Math.min(window.innerWidth - 52, 1300);
  const coarse = matchMedia('(pointer:coarse)').matches;
  const availH = window.innerHeight - (coarse ? 260 : 190);
  const s = Math.floor(Math.min(availW / W, Math.max(availH, H) / H));
  cv.style.width = (s >= 2 ? W * s : Math.max(200, Math.min(availW, W * 2))) + 'px';
}
addEventListener('resize', fit); fit();

/* ---------- input ---------- */
const held = {}, pressed = {};
const KEYMAP = {
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down',
  KeyC:'block', ShiftLeft:'block', ShiftRight:'block',
  KeyZ:'jab', KeyJ:'jab', KeyX:'hook', KeyK:'hook',
  Space:'star', KeyL:'star', Enter:'start', KeyP:'pause', Escape:'pause', KeyM:'mute'
};
function press(a){ if(!held[a]) pressed[a] = true; held[a] = true; }
addEventListener('keydown', e => {
  const a = KEYMAP[e.code]; if(!a) return;
  e.preventDefault(); audioInit(); press(a);
});
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if(a) held[a] = false; });
addEventListener('blur', () => { for (const k in held) held[k] = false; });
cv.addEventListener('pointerdown', () => { audioInit(); cv.focus(); pressed.start = true; });
document.querySelectorAll('[data-k]').forEach(b => {
  const k = b.dataset.k;
  const up = () => { held[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); audioInit(); press(k); b.classList.add('on');
    try { b.setPointerCapture(e.pointerId); } catch(_) {}
  });
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up);
  b.addEventListener('lostpointercapture', up);
  b.addEventListener('contextmenu', e => e.preventDefault());
});

/* ---------- audio ---------- */
let actx = null, master = null, muted = false, noiseBuf = null;
function audioInit() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.22; master.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (_) { actx = null; }
}
function toneAt(freq, dur, type, vol, t, slide) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function tone(freq, dur, type = 'square', vol = 0.2, slide = 0, when = 0) {
  if (actx) toneAt(freq, dur, type, vol, actx.currentTime + when, slide);
}
function noiseAt(t, dur, vol, freq, ftype = 'bandpass') {
  if (!actx) return;
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; f.type = ftype; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
}
function noise(dur, vol = 0.3, freq = 1000, when = 0) { if (actx) noiseAt(actx.currentTime + when, dur, vol, freq); }
const sfx = {
  swing(){ noise(0.05, 0.12, 3000); },
  hit(){ noise(0.08, 0.5, 900); tone(160, 0.08, 'square', 0.18, -80); },
  big(){ noise(0.2, 0.6, 400); tone(110, 0.25, 'sawtooth', 0.25, -60); },
  block(){ tone(1000, 0.035, 'square', 0.1); tone(700, 0.05, 'square', 0.1, 0, 0.035); },
  star(){ [880, 1175, 1568, 2093].forEach((f, i) => tone(f, 0.07, 'square', 0.12, 0, i * 0.05)); },
  thud(){ noise(0.15, 0.4, 200); tone(70, 0.15, 'triangle', 0.3, -30); },
  bell(){ [0, 0.28].forEach(w => { tone(1318, 0.5, 'triangle', 0.3, 0, w); tone(1975, 0.35, 'sine', 0.12, 0, w); }); },
  ko(){ [523, 440, 349, 262, 196].forEach((f, i) => tone(f, 0.16, 'square', 0.14, 0, i * 0.13)); },
  fanfare(){ [[523,0],[659,.12],[784,.24],[1047,.36],[784,.6],[1047,.72]].forEach(([f,w]) => tone(f, 0.2, 'square', 0.13, 0, w)); },
  pause(){ tone(988, 0.06, 'square', 0.1); tone(1319, 0.08, 'square', 0.1, 0, 0.07); },
  coin(){ tone(988, 0.05, 'square', 0.12); tone(1319, 0.12, 'square', 0.12, 0, 0.05); },
  eat(){ [523, 659, 784].forEach((f, i) => tone(f, 0.06, 'triangle', 0.2, 0, i * 0.05)); },
  thunk(){ noise(0.06, 0.35, 500); tone(200, 0.06, 'square', 0.12, -60); },
  crash(){ noise(0.25, 0.55, 700); noise(0.18, 0.3, 2500, 0.04); tone(150, 0.15, 'sawtooth', 0.15, -80); },
  buy(){ [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.06, 'square', 0.12, 0, i * 0.04)); },
  nope(){ tone(150, 0.15, 'square', 0.15); },
  tick(){ tone(660, 0.03, 'square', 0.08); }
};

/* house-and-funk sequencer: 32 sixteenth-note steps with kick, snare, hats, bass and lead */
const mtof = n => 440 * Math.pow(2, (n - 69) / 12);
const SONGS = [
  { bpm: 124,
    bass:[40,0,52,0, 40,40,0,52, 0,40,50,0, 52,0,47,0, 36,0,48,0, 36,36,0,48, 38,0,50,0, 38,0,43,45],
    lead:[0,0,0,0, 64,0,67,0, 0,71,0,69, 0,67,0,64, 0,0,0,0, 64,0,67,0, 0,72,0,71, 0,69,0,67] },
  { bpm: 130,
    bass:[45,0,57,45, 0,45,57,0, 45,0,55,0, 57,0,55,52, 41,0,53,41, 0,41,53,0, 43,0,55,0, 43,47,50,55],
    lead:[76,0,0,74, 0,76,0,79, 0,0,76,0, 74,0,72,0, 72,0,0,71, 0,72,0,74, 0,0,71,0, 67,0,69,0] },
  { bpm: 140,
    bass:[38,38,50,38, 38,50,38,48, 36,36,48,36, 36,48,36,46, 34,34,46,34, 34,46,34,45, 33,33,45,33, 45,33,44,45],
    lead:[62,0,65,0, 69,0,67,65, 0,64,0,62, 0,0,60,0, 62,0,65,0, 70,0,69,67, 0,65,0,64, 0,62,61,0] }
];
let song = null, songStep = 0, nextNote = 0;
function playSong(i){ song = SONGS[i]; songStep = 0; if (actx) nextNote = actx.currentTime + 0.08; }
function stopSong(){ song = null; }
setInterval(() => {
  if (!actx || !song) return;
  if (nextNote < actx.currentTime - 0.5) nextNote = actx.currentTime + 0.05;
  const step = 60 / song.bpm / 4;
  while (nextNote < actx.currentTime + 0.15) {
    const s = songStep % 32, L = song.lead[s], B = song.bass[s], t = nextNote;
    if (B) toneAt(mtof(B), step * 1.6, 'sawtooth', 0.09, t);
    if (L) { toneAt(mtof(L), step * 1.9, 'square', 0.045, t); toneAt(mtof(L) * 1.005, step * 1.9, 'square', 0.03, t); }
    if (s % 4 === 0) toneAt(140, 0.14, 'sine', 0.55, t, -100);
    if (s % 8 === 4) { noiseAt(t, 0.12, 0.28, 1800); toneAt(190, 0.06, 'triangle', 0.15, t); }
    if (s % 4 === 2) noiseAt(t, 0.04, 0.07, 7000, 'highpass');
    nextNote += step; songStep++;
  }
}, 25);

/* ---------- data ---------- */
const MOVES = {
  jab:  { start:3,  active:3, rec:9,  dmg:4,  reach:38, kb:2,   stun:14 },
  hook: { start:9,  active:4, rec:16, dmg:9,  reach:34, kb:4,   stun:22 },
  star: { start:18, active:6, rec:22, dmg:24, reach:40, kb:5.5, stun:30, launch:true }
};
const SK = { a:'#f0b088', b:'#c88058', c:'#8c5434' };
const pal = (skin, o) => Object.assign({ skin: SK[skin], hair:null, hairStyle:'short', shirt:null, belt:'#3c2418', shoes:'#202028' }, o);
const TYPES = {
  thug:    { name:'ALLEY CAT',     hp:30,  speed:1.0,  aggro:0.03,  block:0.12, power:1,   tell:{jab:7,hook:12}, moves:['jab','jab','hook'],         score:300,  bulk:0,
             pal: pal('b', { hair:'#181018', jacket:'#a82830', shirt:'#2c2030', pants:'#3c4460', gloves:'#8c5c30' }) },
  speedy:  { name:'SPEEDY RICO',   hp:26,  speed:1.6,  aggro:0.05,  block:0.3,  power:0.8, tell:{jab:6,hook:11}, moves:['jab','jab','jab','hook'],  score:400,  bulk:0,
             pal: pal('a', { hair:'#f040a0', hairStyle:'mohawk', vest:'#282830', pants:'#e8b820', shoes:'#ececec', gloves:'#f0d020' }) },
  bruiser: { name:'BIG TONY',      hp:55,  speed:0.75, aggro:0.025, block:0.22, power:1.4, tell:{jab:8,hook:14}, moves:['hook','hook','jab'],        score:600,  bulk:2,
             pal: pal('c', { hairStyle:'bald', beard:'#201010', vest:'#6c4428', pants:'#44444c', gloves:'#282828' }) },
  boss1:   { name:'BRUNO BRICK',   hp:110, speed:0.95, aggro:0.04,  block:0.3,  power:1.5, tell:{jab:6,hook:11}, moves:['hook','jab','hook','jab'], score:3000, bulk:3, boss:true,
             pal: pal('a', { hairStyle:'bald', stache:'#5c3018', shades:true, shirt:'#4c6c34', pants:'#6c6c48', shoes:'#3c3020', gloves:'#2058e0' }) },
  boss2:   { name:'VINNIE VOLT',   hp:120, speed:1.7,  aggro:0.06,  block:0.4,  power:1.3, tell:{jab:5,hook:10}, moves:['jab','jab','hook','jab'],  score:4000, bulk:1, boss:true,
             pal: pal('b', { hair:'#100810', hairStyle:'long', shades:true, jacket:'#ececec', shirt:'#e02060', pants:'#ececec', belt:'#202020', gloves:'#40e090' }) },
  boss3:   { name:'GRANITE GRANT', hp:160, speed:1.3,  aggro:0.06,  block:0.4,  power:1.7, tell:{jab:5,hook:9},  moves:['hook','jab','jab','hook'], score:8000, bulk:3, boss:true,
             pal: pal('c', { hair:'#100810', hairStyle:'flattop', pants:'#282878', belt:'#f8c800', shoes:'#f8c800', gloves:'#f8c800' }) }
};
const PLAYER_PAL = pal('a', { hair:'#6c3418', band:'#d82020', shirt:'#f0f0f0', pants:'#3058b0', shoes:'#d83030', gloves:'#e02828' });
/* Jack Johnson, heavyweight champion 1908-1915: shaved head, gold-tooth grin, long white trunks, flag sash, leather gloves, high boots */
const JACK_PAL = pal('c', { skin:'#94583a', hairStyle:'bald', goldTooth:true, pants:'#ece6d4', shorts:true, belt:'#2848a8', beltStars:true, sash:'#c82830', boots:true, shoes:'#1c1820', gloves:'#d8a868' });
const FIGHTERS = [
  { name:'DUKE', full:'DUKE',         tag:'STREET BRAWLER',      pal:PLAYER_PAL, bulk:0, hp:100, power:1,   speed:1,    stats:[3, 3, 4] },
  { name:'JACK', full:'JACK JOHNSON', tag:'THE GALVESTON GIANT', pal:JACK_PAL,   bulk:2, hp:115, power:1.2, speed:0.9,  stats:[5, 4, 3] }

const STAGES = [

    waves:[{at:240,foes:['thug']},{at:560,foes:['thug','thug']},{at:900,foes:['speedy','thug']},{at:1500,foes:['boss1']}] },
  { name:'THE DOCKS',  sub:'SUNSET AT PIER 9',        len:1900, bg:'docks', song:1, seed:23,

  { name:'FIGHT CLUB', sub:'NO RULES. NO REFS.',      len:1700, bg:'club',  song:2, seed:37,
    waves:[{at:220,foes:['bruiser','speedy']},{at:560,foes:['thug','bruiser','speedy']},{at:920,foes:['bruiser','bruiser']},{at:1500,foes:['boss3']}] }
];

/* gym upgrades bought with cash between stages */
const UPGRADES = [

  { key:'stamina', name:'STAMINA',    info:'MAX HP +20',               max:5, cost:[50, 90, 140, 200, 270] },

/* breakable props per stage background */
const PROP_KINDS = { city:['can','can','crate'], docks:['crate','barrel','crate'], club:['crate','can','barrel'] };
const PROP_HP = { crate:[10, 22], barrel:[14, 28], can:[6, 14] };
const FOODS = [{ name:'APPLE', hp:12 }, { name:'BURGER', hp:25 }, { name:'CHICKEN', hp:45 }];

/* ---------- helpers ---------- */
function rng(seed){ return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(a, b){ let h = (a * 374761393 + b * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, w, h); };
const shadeCache = {};
/* 16-bit style shading: shadows lean purple, highlights lean white */
function shade(hex, k){
  const key = hex + k; if (shadeCache[key]) return shadeCache[key];
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  if (k < 0) { const f = -k; r += (28 - r) * f; g += (14 - g) * f; b += (52 - b) * f; }
  else { r += (255 - r) * k; g += (255 - g) * k; b += (240 - b) * k; }
  return shadeCache[key] = '#' + ((1 << 24) | (Math.round(r) << 16) | (Math.round(g) << 8) | Math.round(b)).toString(16).slice(1);
}
function txt(s, x, y, c = '#fcfcfc', align = 'left', size = 8, sh = '#140c1c') {
  ctx.font = size + 'px "Press Start 2P", ui-monospace, monospace';
  ctx.textAlign = align; ctx.textBaseline = 'top';
  if (sh) {
    ctx.fillStyle = sh;
    for (const [dx, dy] of [[-1,0],[1,0],[0,-1],[0,1],[1,1]]) ctx.fillText(s, x + dx, y + dy);
    if (size > 8) ctx.fillText(s, x + 2, y + 2);
  }
  ctx.fillStyle = c; ctx.fillText(s, x, y);
}
function starIcon(x, y, c){ R(x+3,y,1,7,c); R(x,y+2,7,2,c); R(x+2,y+1,3,5,c); R(x+1,y+5,2,2,c); R(x+4,y+5,2,2,c); }
/* outlined, shaded box lit from the top left */
function box(x, y, w, h, c){
  R(x - 1, y - 1, w + 2, h + 2, '#140c1c'); R(x, y, w, h, c);
  R(x + w - Math.max(2, w * 0.25 | 0), y, Math.max(2, w * 0.25 | 0), h, shade(c, -0.35));

function tryHit(a){

function dropCash(x, y, val){ pickups.push({ kind:'cash', val, x, y: clamp(y, Y_MIN, Y_MAX), z:-8, vz:-2.4, vx:(Math.random() - 0.5) * 2, life:900 }); }

/* ---------- enemy AI ---------- */
function enemyAI(e){
  const T = e.type, dx = player.x - e.x, dist = Math.abs(dx);
  const pDown = player.state === 'down' || player.state === 'air';
  if (!['idle','walk','block'].includes(e.state)) return;
  if (!pDown) e.face = dx >= 0 ? 1 : -1;
  if (e.state === 'block') { if (e.t > (e.blockT || 24)) setState(e, 'idle'); return; }
  const dy = player.y - e.y;
  if (player.state === 'atk' && player.t === 1 && dist < 50 && Math.abs(dy) < 10 && e.attacker && Math.random() < T.block * (1 + stageIdx * 0.2)) {
    setState(e, 'block'); e.blockT = 20 + (Math.random() * 16 | 0); return;
  }
  let want = e.attacker ? 30 : 76 + e.slot * 22;
  if (pDown) want = 90;
  const sp = T.speed;
  // line up on the player's depth; waiting enemies hover above or below
  const wantY = e.attacker && !pDown ? player.y : clamp(player.y + (e.slot & 1 ? -20 : 20), Y_MIN, Y_MAX);
  let moving = false;
  if (Math.abs(wantY - e.y) > 1.5) { e.y += Math.sign(wantY - e.y) * sp * 0.6; moving = true; }
  if (dist > want + 4) { e.x += Math.sign(dx) * sp; moving = true; }
  else if (dist < want - 4) { e.x -= Math.sign(dx) * sp * 0.6; moving = true; }
  setState(e, moving ? 'walk' : 'idle');
  const diff = 1 + stageIdx * 0.3;
  if (e.attacker && !pDown && dist < 40 && Math.abs(dy) < 6 && e.cool <= 0 && Math.random() < T.aggro * diff) {
    startMove(e, T.moves[Math.random() * T.moves.length | 0]);
    e.cool = (30 + Math.random() * 50) / diff;
  }
}

/* ---------- game flow ---------- */

function updateShop(){
  timer++; player.t++;
  const n = UPGRADES.length;
  if (pressed.up) { shopSel = (shopSel + n - 1) % n; sfx.tick(); shopMsg = null; }
  if (pressed.down) { shopSel = (shopSel + 1) % n; sfx.tick(); shopMsg = null; }
  const u = UPGRADES[shopSel];
  if (timer > 20 && (pressed.start || ((pressed.jab || pressed.hook) && u.key === 'leave'))) { startStage(stageIdx + 1); return; }
  if (!(pressed.jab || pressed.hook) || u.key === 'leave') return;
  const c = upCost(u);
  if (c == null) { shopMsg = ['MAXED OUT', '#8c84a0']; sfx.nope(); }
  else if (u.key === 'heal' && player.hp >= player.maxHp) { shopMsg = ['HP IS ALREADY FULL', '#8c84a0']; sfx.nope(); }
  else if (money < c) { shopMsg = ['NEED $' + (c - money) + ' MORE', '#ff3060']; sfx.nope(); }

}

}

    drawForeground();
    ctx.restore();
    ctx.fillStyle = 'rgba(12,6,24,.55)'; ctx.fillRect(0, 26, W, 92);
    bigTitle('KNOCKOUT', 34, 24);
    bigTitle('ALLEY', 64, 24);
    txt('STREET  BOXING', W / 2, 96, '#90d8f8', 'center');
    if ((frameN >> 5) & 1) txt('PRESS START', W / 2, 126, '#fcfcfc', 'center');
    txt('HI ' + String(hiscore).padStart(6, '0'), W / 2, 8, '#f8c820', 'center');
    return;
  }

  const scene = [];
  for (const pr of props) scene.push([pr.y - 0.5, () => drawProp(pr)]);
  for (const q of pickups) scene.push([q.y - 1, () => drawPickup(q)]);
  for (const e of enemies) scene.push([e.y - (e.state === 'down' ? 6 : 0), () => drawBoxer(e)]);
  scene.push([player.y + 0.1, () => drawBoxer(player)]);
  scene.sort((a, b) => a[0] - b[0]).forEach(d => d[1]());
  for (const s of sparks) drawSpark(s);
  for (const q of parts) R(Math.round(q.x - camX), Math.round(q.y), q.sz || 2, q.sz || 2, q.c);
  drawForeground();
  for (const f of floats) txt(f.s, Math.round(f.x - camX), Math.round(f.y), f.c, 'center');
  ctx.restore();
  drawHUD();

  if (goT > 0 && (goT >> 4) & 1) { txt('GO', W - 52, 96, '#f8d020'); R(W - 34, 98, 8, 4, '#f8d020'); R(W - 26, 95, 2, 10, '#f8d020'); R(W - 24, 96, 2, 8, '#f8d020'); R(W - 22, 97, 2, 6, '#f8d020'); R(W - 20, 98, 2, 4, '#f8d020'); }
  if (banner) { const y = 44; ctx.fillStyle = 'rgba(12,6,24,.75)'; ctx.fillRect(0, y, W, 30); txt('VS.', W / 2, y + 4, '#ff3060', 'center'); txt(banner.s, W / 2, y + 16, '#fcfcfc', 'center'); }
  if (state === 'intro') overlayCard([['STAGE ' + (stageIdx + 1), '#f8d020', 16], [stage.name, '#fcfcfc'], [stage.sub, '#90d8f8']]);
  if (state === 'clear' && timer > 20) overlayCard([[stageIdx < 2 ? 'STAGE CLEAR!' : 'TITLE WON!', '#f8d020', 16], ['SCORE ' + String(score).padStart(6, '0'), '#fcfcfc'], [stageIdx < 2 ? 'NEXT: THE GYM' : '', '#90d8f8']]);
  if (state === 'gameover') overlayCard([['GAME OVER', '#ff3060', 16], ['SCORE ' + String(score).padStart(6, '0'), '#fcfcfc'], [timer > 60 && (frameN >> 5) & 1 ? 'PRESS START TO CONTINUE' : '', '#90d8f8']]);
  if (state === 'victory') overlayCard([['NEW CHAMPION!', '#f8d020', 16], ['FINAL ' + String(score).padStart(6, '0'), '#fcfcfc'], [timer > 120 && (frameN >> 5) & 1 ? 'PRESS START' : 'THE STREETS ARE YOURS', '#90d8f8']]);
  if (paused) overlayCard([['PAUSE', '#fcfcfc', 16], ['P TO RESUME', '#90d8f8']]);
  if (muted) txt('SOUND OFF', W - 6, 214, '#8c84a0', 'right');
}

/* ---------- loop ---------- */
stage = STAGES[0]; build(stage); player = makePlayer(); applyUpgrades(player);
let acc = 0, last = performance.now();
const STEP = 1000 / 60;
function frame(now){
  acc += Math.min(100, now - last); last = now;
  let ran = false;
  while (acc >= STEP) { update(); acc -= STEP; if (!ran) { for (const k in pressed) pressed[k] = false; ran = true; } }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
