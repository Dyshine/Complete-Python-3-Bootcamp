<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Knockout Alley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one 256x224 arcade screen set in a dark cabinet, controls legend below, touch pad on phones */
:root{
  --cabinet:#16121e;
  --bezel:#2c2438;
  --ink:#08060c;
  --text:#ece4d4;
  --dim:#8c82a0;
  --red:#e40058;
  --gold:#f8b800;
  --font-pixel:"Press Start 2P", ui-monospace, "Courier New", monospace;
  color-scheme: dark;
}
html,body{height:100%}
body{background:var(--cabinet);color:var(--text);font-family:var(--font-pixel)}
.wrap{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-inline:16px;padding-block:16px}
.marquee{margin:0;font-size:clamp(14px,3.2vw,22px);font-weight:400;letter-spacing:.08em;color:var(--gold);text-shadow:3px 3px 0 var(--red);text-align:center;text-wrap:balance}
.screen{position:relative;background:#000;padding:10px;border-radius:14px;box-shadow:inset 0 0 0 3px var(--bezel),0 0 0 6px var(--ink);max-width:100%;box-sizing:border-box}
.screen::after{content:"";position:absolute;inset:10px;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.16) 2px,rgba(0,0,0,.16) 3px)}
canvas{display:block;width:512px;max-width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;outline:none;cursor:pointer}
canvas:focus-visible{box-shadow:0 0 0 2px var(--gold)}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 24px;max-width:720px;font-size:9px;line-height:2;color:var(--dim)}
.legend span{white-space:nowrap}
kbd{font-family:inherit;font-size:8px;color:var(--ink);background:var(--text);padding:2px 5px;border-radius:2px;box-shadow:0 2px 0 var(--dim)}
.pad{display:none;width:100%;max-width:560px;justify-content:space-between;align-items:center;gap:12px;user-select:none;-webkit-user-select:none;touch-action:none}
.cluster{display:flex;gap:8px;align-items:center}
.pad button{font-family:inherit;font-size:11px;color:var(--text);background:var(--bezel);border:0;border-radius:50%;width:56px;height:56px;box-shadow:0 4px 0 var(--ink);touch-action:none}
.pad button:active,.pad button.on{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pad .dir{border-radius:8px;width:44px;height:44px}
.dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:2px}
.d-up{grid-area:1/2}.d-left{grid-area:2/1}.d-right{grid-area:2/3}.d-down{grid-area:3/2}
.pad .cluster{flex-wrap:wrap;justify-content:flex-end;max-width:132px}
.pad .b-block{background:#0058f8}
.pad .b-jab{background:var(--red)}
.pad .b-hook{background:#a81000}
.pad .b-star{background:var(--gold);color:var(--ink)}
.sys{display:none;gap:12px}
.sys button{font-family:inherit;font-size:8px;color:var(--dim);background:transparent;border:2px solid var(--bezel);border-radius:12px;padding:6px 12px}
@media (pointer:coarse){.pad,.sys{display:flex}.legend{display:none}}
@media (prefers-reduced-motion:reduce){.pad button{transition:none}}
</style>

<div class="wrap">
  <h1 class="marquee">KNOCKOUT ALLEY</h1>
  <div class="screen"><canvas id="game" width="256" height="224" tabindex="0" aria-label="Knockout Alley game screen"></canvas></div>
  <div class="pad" id="pad">
    <div class="dpad">
      <button class="dir d-up" data-k="up" aria-label="Move up">&#9650;&#xFE0E;</button>
      <button class="dir d-left" data-k="left" aria-label="Move left">&#9664;&#xFE0E;</button>
      <button class="dir d-right" data-k="right" aria-label="Move right">&#9654;&#xFE0E;</button>
      <button class="dir d-down" data-k="down" aria-label="Move down">&#9660;&#xFE0E;</button>
    </div>
    <div class="cluster">
      <button class="b-block" data-k="block" aria-label="Block">BLK</button>
      <button class="b-star" data-k="star" aria-label="Star punch">&#9733;&#xFE0E;</button>
      <button class="b-hook" data-k="hook" aria-label="Uppercut">UPP</button>
      <button class="b-jab" data-k="jab" aria-label="Jab">JAB</button>
    </div>
  </div>
  <div class="sys">
    <button data-k="start" id="b-start">START</button>
    <button data-k="mute" id="b-mute">SOUND</button>
  </div>
  <div class="legend">
    <span><kbd>&larr;</kbd> <kbd>&uarr;</kbd> <kbd>&darr;</kbd> <kbd>&rarr;</kbd> MOVE</span>
    <span><kbd>C</kbd> BLOCK</span>
    <span><kbd>Z</kbd> JAB</span>
    <span><kbd>X</kbd> UPPERCUT</span>
    <span><kbd>SPACE</kbd> STAR PUNCH</span>
    <span><kbd>ENTER</kbd> START</span>
    <span><kbd>P</kbd> PAUSE</span>
    <span><kbd>M</kbd> SOUND</span>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 256, H = 224, GROUND = 206, Y_MIN = 180, Y_MAX = 218;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* ---------- screen fit ---------- */
function fit() {
  const availW = Math.min(window.innerWidth - 52, 1100);
  const coarse = matchMedia('(pointer:coarse)').matches;
  const availH = window.innerHeight - (coarse ? 260 : 190);
  const s = Math.floor(Math.min(availW / W, Math.max(availH, H) / H));
  cv.style.width = (s >= 2 ? W * s : Math.max(160, Math.min(availW, W * 2))) + 'px';
}
addEventListener('resize', fit); fit();

/* ---------- input ---------- */
const held = {}, pressed = {};
const KEYMAP = {
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down',
  KeyC:'block', ShiftLeft:'block', ShiftRight:'block',
  KeyZ:'jab', KeyJ:'jab', KeyX:'hook', KeyK:'hook',
  Space:'star', KeyL:'star', Enter:'start', KeyP:'pause', Escape:'pause', KeyM:'mute'
};
function press(a){ if(!held[a]) pressed[a] = true; held[a] = true; }
addEventListener('keydown', e => {
  const a = KEYMAP[e.code]; if(!a) return;
  e.preventDefault(); audioInit(); press(a);
});
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if(a) held[a] = false; });
addEventListener('blur', () => { for (const k in held) held[k] = false; });
cv.addEventListener('pointerdown', () => { audioInit(); cv.focus(); pressed.start = true; });
document.querySelectorAll('[data-k]').forEach(b => {
  const k = b.dataset.k;
  const up = () => { held[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); audioInit(); press(k); b.classList.add('on');
    try { b.setPointerCapture(e.pointerId); } catch(_) {}
  });
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up);
  b.addEventListener('lostpointercapture', up);
  b.addEventListener('contextmenu', e => e.preventDefault());
});

/* ---------- audio ---------- */
let actx = null, master = null, muted = false, noiseBuf = null;
function audioInit() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.22; master.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (_) { actx = null; }
}
function toneAt(freq, dur, type, vol, t, slide) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function tone(freq, dur, type = 'square', vol = 0.2, slide = 0, when = 0) {
  if (actx) toneAt(freq, dur, type, vol, actx.currentTime + when, slide);
}
function noise(dur, vol = 0.3, freq = 1000, when = 0) {
  if (!actx) return;
  const t = actx.currentTime + when;
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
}
const sfx = {
  swing(){ noise(0.05, 0.12, 3000); },
  hit(){ noise(0.08, 0.5, 900); tone(160, 0.08, 'square', 0.18, -80); },
  big(){ noise(0.2, 0.6, 400); tone(110, 0.25, 'sawtooth', 0.25, -60); },
  block(){ tone(1000, 0.035, 'square', 0.1); tone(700, 0.05, 'square', 0.1, 0, 0.035); },
  star(){ [880, 1175, 1568, 2093].forEach((f, i) => tone(f, 0.07, 'square', 0.12, 0, i * 0.05)); },
  thud(){ noise(0.15, 0.4, 200); tone(70, 0.15, 'triangle', 0.3, -30); },
  bell(){ [0, 0.28].forEach(w => { tone(1318, 0.5, 'triangle', 0.3, 0, w); tone(1975, 0.35, 'sine', 0.12, 0, w); }); },
  ko(){ [523, 440, 349, 262, 196].forEach((f, i) => tone(f, 0.16, 'square', 0.14, 0, i * 0.13)); },
  fanfare(){ [[523,0],[659,.12],[784,.24],[1047,.36],[784,.6],[1047,.72]].forEach(([f,w]) => tone(f, 0.2, 'square', 0.13, 0, w)); },
  pause(){ tone(988, 0.06, 'square', 0.1); tone(1319, 0.08, 'square', 0.1, 0, 0.07); },
  coin(){ tone(988, 0.05, 'square', 0.12); tone(1319, 0.12, 'square', 0.12, 0, 0.05); },
  eat(){ [523, 659, 784].forEach((f, i) => tone(f, 0.06, 'triangle', 0.2, 0, i * 0.05)); },
  thunk(){ noise(0.06, 0.35, 500); tone(200, 0.06, 'square', 0.12, -60); },
  crash(){ noise(0.25, 0.55, 700); noise(0.18, 0.3, 2500, 0.04); tone(150, 0.15, 'sawtooth', 0.15, -80); },
  buy(){ [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.06, 'square', 0.12, 0, i * 0.04)); },
  nope(){ tone(150, 0.15, 'square', 0.15); },
  tick(){ tone(660, 0.03, 'square', 0.08); }
};

/* chiptune sequencer: 32 eighth-note steps, square lead + triangle bass + noise hat */
const mtof = n => 440 * Math.pow(2, (n - 69) / 12);
const SONGS = [
  { bpm: 148,
    lead:[69,0,69,72, 0,74,0,76, 76,0,74,72, 74,0,0,0, 69,0,69,72, 0,74,0,79, 76,0,74,72, 69,0,0,0],
    bass:[45,0,45,57, 45,0,45,57, 41,0,41,53, 41,0,41,53, 43,0,43,55, 43,0,43,55, 40,0,40,52, 40,0,44,0] },
  { bpm: 160,
    lead:[76,0,76,79, 81,0,79,76, 74,0,74,76, 72,0,0,0, 76,0,76,79, 81,0,84,83, 81,0,79,76, 81,0,0,0],
    bass:[45,57,45,57, 45,57,45,57, 43,55,43,55, 43,55,43,55, 41,53,41,53, 41,53,41,53, 40,52,40,52, 44,56,44,0] },
  { bpm: 172,
    lead:[69,72,76,0, 75,0,74,0, 72,74,72,69, 0,0,68,0, 69,72,76,0, 81,0,79,0, 76,77,76,74, 72,0,71,0],
    bass:[45,45,57,45, 45,45,57,45, 41,41,53,41, 41,41,53,41, 38,38,50,38, 40,40,52,40, 45,45,57,45, 44,44,56,44] }
];
let song = null, songStep = 0, nextNote = 0;
function playSong(i){ song = SONGS[i]; songStep = 0; if (actx) nextNote = actx.currentTime + 0.08; }
function stopSong(){ song = null; }
setInterval(() => {
  if (!actx || !song) return;
  if (nextNote < actx.currentTime - 0.5) nextNote = actx.currentTime + 0.05;
  const step = 60 / song.bpm / 2;
  while (nextNote < actx.currentTime + 0.15) {
    const s = songStep % 32, L = song.lead[s], B = song.bass[s];
    if (L) toneAt(mtof(L), step * 0.9, 'square', 0.06, nextNote);
    if (B) toneAt(mtof(B), step * 0.95, 'triangle', 0.2, nextNote);
    if (s % 2 === 1 && noiseBuf) {
      const src = actx.createBufferSource(), g = actx.createGain(), f = actx.createBiquadFilter();
      src.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = 6000;
      g.gain.setValueAtTime(0.05, nextNote); g.gain.exponentialRampToValueAtTime(0.001, nextNote + 0.04);
      src.connect(f); f.connect(g); g.connect(master); src.start(nextNote); src.stop(nextNote + 0.05);
    }
    nextNote += step; songStep++;
  }
}, 25);

/* ---------- data ---------- */
const MOVES = {
  jab:  { start:3,  active:3, rec:9,  dmg:4,  reach:26, kb:1.5, stun:14 },
  hook: { start:9,  active:4, rec:16, dmg:9,  reach:23, kb:3,   stun:22 },
  star: { start:18, active:6, rec:22, dmg:24, reach:27, kb:4,   stun:30, launch:true }
};
const SK = {
  a: ['#fcc89c', '#d88c5c'],
  b: ['#c8844c', '#8c4c24'],
  c: ['#8c5028', '#5c3018']
};
const pal = (skin, o) => Object.assign({ skin: SK[skin][0], shade: SK[skin][1], belt:'#fcfcfc', shoes:'#fcfcfc', hair:null }, o);
const TYPES = {
  thug:    { name:'ALLEY CAT',     hp:30,  speed:0.7,  aggro:0.03,  block:0.12, power:1,   tell:{jab:7,hook:12}, moves:['jab','jab','hook'],         score:300,  bulk:0,
             pal: pal('b', { hair:'#000000', trunks:'#0058f8', gloves:'#ac7c00', gloveD:'#503000', shoes:'#3c3c3c' }) },
  speedy:  { name:'SPEEDY RICO',   hp:26,  speed:1.15, aggro:0.05,  block:0.3,  power:0.8, tell:{jab:6,hook:11}, moves:['jab','jab','jab','hook'],  score:400,  bulk:0,
             pal: pal('a', { hair:'#f8b800', band:'#e40058', trunks:'#d800cc', gloves:'#f8b800', gloveD:'#ac7c00' }) },
  bruiser: { name:'BIG TONY',      hp:55,  speed:0.5,  aggro:0.025, block:0.22, power:1.4, tell:{jab:8,hook:14}, moves:['hook','hook','jab'],        score:600,  bulk:2,
             pal: pal('c', { trunks:'#a81000', gloves:'#3c3c3c', gloveD:'#1c1c1c', shoes:'#7c7c7c' }) },
  boss1:   { name:'BRUNO BRICK',   hp:110, speed:0.65, aggro:0.04,  block:0.3,  power:1.5, tell:{jab:6,hook:11}, moves:['hook','jab','hook','jab'], score:3000, bulk:3, boss:true,
             pal: pal('a', { stache:'#503000', trunks:'#7c7c7c', belt:'#f8b800', gloves:'#0058f8', gloveD:'#0000a8', shoes:'#3c3c3c' }) },
  boss2:   { name:'VINNIE VOLT',   hp:120, speed:1.2,  aggro:0.06,  block:0.4,  power:1.3, tell:{jab:5,hook:10}, moves:['jab','jab','hook','jab'],  score:4000, bulk:1, boss:true,
             pal: pal('b', { hair:'#000000', band:'#58f898', trunks:'#e40058', belt:'#f8b800', gloves:'#58f898', gloveD:'#00a844' }) },
  boss3:   { name:'GRANITE GRANT', hp:160, speed:0.9,  aggro:0.06,  block:0.4,  power:1.7, tell:{jab:5,hook:9},  moves:['hook','jab','jab','hook'], score:8000, bulk:3, boss:true,
             pal: pal('c', { hair:'#000000', trunks:'#f8b800', belt:'#fcfcfc', gloves:'#fcfcfc', gloveD:'#bcbcbc', shoes:'#f8b800' }) }
};
/* gym upgrades bought with cash between stages */
const UPGRADES = [
  { key:'power',   name:'POWER',      info:'PUNCHES HIT 15% HARDER',   max:5, cost:[60, 100, 150, 220, 300] },
  { key:'stamina', name:'STAMINA',    info:'MAX HP +20',               max:5, cost:[50, 90, 140, 200, 270] },
  { key:'speed',   name:'FOOTWORK',   info:'MOVE 12% FASTER',          max:3, cost:[70, 130, 200] },
  { key:'chin',    name:'IRON CHIN',  info:'TAKE 10% LESS DAMAGE',     max:4, cost:[80, 140, 210, 290] },
  { key:'stars',   name:'STAR START', info:'+1 STAR AT EACH STAGE',    max:3, cost:[90, 160, 240] },
  { key:'heal',    name:'ICE BATH',   info:'REFILL HP TO FULL',        max:0, cost:[40] },
  { key:'leave',   name:'NEXT FIGHT', info:'LEAVE THE GYM' }
];
/* breakable props per stage background */
const PROP_KINDS = { pier:['crate','barrel','crate'], street:['can','can','crate'], arena:['crate','can','barrel'] };
const PROP_HP = { crate:[10, 22], barrel:[14, 28], can:[6, 14] };
const FOODS = [{ name:'APPLE', hp:12 }, { name:'BURGER', hp:25 }, { name:'CHICKEN', hp:45 }];

const PLAYER_PAL = pal('a', { hair:'#7c3c10', trunks:'#00a800', gloves:'#e40058', gloveD:'#a80020' });

const STAGES = [
  { name:'PIER 9',        sub:'MIDNIGHT ON THE DOCKS', len:1500, bg:'pier',   song:0, seed:11,
    waves:[{at:220,foes:['thug']},{at:520,foes:['thug','thug']},{at:860,foes:['speedy','thug']},{at:1300,foes:['boss1']}] },
  { name:'MAIN STREET',   sub:'DUSK DOWNTOWN',         len:1750, bg:'street', song:1, seed:23,
    waves:[{at:200,foes:['speedy','thug']},{at:520,foes:['bruiser']},{at:840,foes:['thug','speedy','thug']},{at:1160,foes:['bruiser','speedy']},{at:1550,foes:['boss2']}] },
  { name:'THE COLISEUM',  sub:'TITLE FIGHT TONIGHT',   len:1500, bg:'arena',  song:2, seed:37,
    waves:[{at:200,foes:['bruiser','speedy']},{at:520,foes:['thug','bruiser','speedy']},{at:860,foes:['bruiser','bruiser']},{at:1300,foes:['boss3']}] }
];

/* ---------- helpers ---------- */
function rng(seed){ return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(a, b){ let h = (a * 374761393 + b * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, w, h); };
function txt(s, x, y, c = '#fcfcfc', align = 'left', size = 8, sh = '#000') {
  ctx.font = size + 'px "Press Start 2P", ui-monospace, monospace';
  ctx.textAlign = align; ctx.textBaseline = 'top';
  if (sh) { ctx.fillStyle = sh; ctx.fillText(s, x + (size > 8 ? 2 : 1), y + (size > 8 ? 2 : 1)); }
  ctx.fillStyle = c; ctx.fillText(s, x, y);
}
function starIcon(x, y, c){ R(x+3,y,1,7,c); R(x,y+2,7,2,c); R(x+2,y+1,3,5,c); R(x+1,y+5,2,2,c); R(x+4,y+5,2,2,c); }

/* ---------- state ---------- */
let state = 'title', stageIdx = 0, stage = STAGES[0], camX = 0, locked = false, lockX = 0, waveIdx = 0;
let enemies = [], sparks = [], parts = [], floats = [];
let score = 0, hiscore = 0, lives = 3, timer = 0, shakeT = 0, shakeMag = 0, hitstop = 0, goT = 0;
let paused = false, focusEnemy = null, frameN = 0, crowdHype = 0, banner = null, player = null;
let props = [], pickups = [], money = 0, shopSel = 0, shopMsg = null;
try { hiscore = +localStorage.getItem('ko-alley-hi') || 0; } catch (_) {}
function saveHi(){ if (score > hiscore) { hiscore = score; try { localStorage.setItem('ko-alley-hi', hiscore); } catch (_) {} } }

function makeFighter(o){
  return Object.assign({ x:0, y:GROUND, z:0, vx:0, vy:0, face:1, state:'idle', t:0, hp:100, maxHp:100,
    invul:0, cool:60, flashT:0, bulk:0, power:1, move:null, mStart:0, hitDone:false, downTime:50 }, o);
}
function makePlayer(){
  return makeFighter({ isPlayer:true, pal:PLAYER_PAL, stars:0, combo:0, queued:null, maxHp:100, hp:100,
    up:{ power:0, stamina:0, speed:0, chin:0, stars:0 } });
}
function applyUpgrades(p){
  p.power = 1 + p.up.power * 0.15;
  p.maxHp = 100 + p.up.stamina * 20;
  p.speed = 1.35 * (1 + p.up.speed * 0.12);
  p.chin = 1 - p.up.chin * 0.1;
}
function makeEnemy(kind, x){
  const T = TYPES[kind], hp = Math.round(T.hp * (1 + stageIdx * 0.2));
  return makeFighter({ kind, type:T, x, y: Y_MIN + Math.random() * (Y_MAX - Y_MIN), face: x < player.x ? 1 : -1, hp, maxHp:hp, pal:T.pal, bulk:T.bulk,
    power:T.power * (1 + stageIdx * 0.1), cool:50 + Math.random() * 50, entered:false, state:'walk' });
}
function setState(f, s){ if (f.state !== s) { f.state = s; f.t = 0; } }
function startMove(f, mv){
  f.state = 'atk'; f.move = mv; f.t = 0; f.hitDone = false;
  f.mStart = MOVES[mv].start + (f.isPlayer ? 0 : f.type.tell[mv] || 0);
  if (f.isPlayer) sfx.swing();
}
function shake(n){ shakeT = Math.max(shakeT, n); shakeMag = Math.max(shakeMag, n > 6 ? 3 : 2); }

/* ---------- scenery ---------- */
function build(st){
  if (st.built) return;
  const r = rng(st.seed);
  const row = (p, minW, maxW, minH, maxH, gap) => {
    const a = []; let x = -40; const L = st.len * p + W + 80;
    while (x < L) { const w = minW + (r() * (maxW - minW) | 0), h = minH + (r() * (maxH - minH) | 0); a.push({ x, w, h, k:r() }); x += w + (gap ? r() * gap | 0 : 0); }
    return a;
  };
  st.far = row(0.25, 14, 34, 24, 74, 4);
  st.mid = row(0.6, 44, 84, 46, 96, 14);
  st.stars = Array.from({ length: 46 }, () => ({ x: r() * W * 1.4, y: 32 + r() * 80, k: r() }));
  st.built = true;
}
function bands(cols, y0, bh){
  cols.forEach((c, i) => R(0, y0 + i * bh, W, bh, c));
  for (let i = 1; i < cols.length; i++) {
    const y = y0 + i * bh; ctx.fillStyle = cols[i];
    for (let x = (i & 1); x < W; x += 2) ctx.fillRect(x, y - 2, 1, 1);
    for (let x = ((i + 1) & 1); x < W; x += 2) ctx.fillRect(x, y - 1, 1, 1);
  }
}
function disc(cx, cy, rad, c){ for (let y = -rad; y <= rad; y++) { const w = Math.round(Math.sqrt(rad * rad - y * y)); R(cx - w, cy + y, w * 2, 1, c); } }
function eachVisible(arr, p, fn){ const off = camX * p; for (const b of arr) { const sx = Math.round(b.x - off); if (sx > W || sx + b.w < 0) continue; fn(b, sx); } }

/* ---------- boxer sprite (rect layers, black-outlined, mirrored by facing) ---------- */
function drawBoxer(f){
  if (f.dead) return;
  if (f.invul > 0 && (f.invul >> 2) & 1 && f.state !== 'down') return;
  if (!f.isPlayer && f.state === 'down' && f.hp <= 0 && f.t > f.downTime - 40 && (f.t >> 1) & 1) return;
  const P = f.pal, s = f.face, X = Math.round(f.x - camX), Y = Math.round(f.y + (f.z || 0));
  const L = [[], [], []];
  const A = (l, x, y, w, h, c) => L[l].push([x, y, w, h, c]);
  const st = f.state, t = f.t, bulk = f.bulk;
  let gl = P.gloves;
  // shadow stays on the floor while airborne
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(X - 10, Math.round(f.y) - 1, 20, 3);

  if (st === 'down' || st === 'air') {
    const yy = st === 'air' ? -2 : 0;
    A(0, 17, -6 + yy, 4, 6, P.shoes); A(0, 6, -5 + yy, 12, 4, P.skin);
    A(0, -1, -7 + yy, 8, 6, P.trunks); A(0, 5, -7 + yy, 2, 6, P.belt);
    A(0, -13 - bulk, -7 + yy, 13 + bulk, 6, P.skin);
    A(0, -22 - bulk, -8 + yy, 9, 8, P.skin);
    if (P.hair) A(0, -22 - bulk, -8 + yy, 3, 8, P.hair);
    A(0, -17 - bulk, -6 + yy, 1, 1, '#000'); A(0, -16 - bulk, -5 + yy, 1, 1, '#000'); A(0, -15 - bulk, -6 + yy, 1, 1, '#000'); A(0, -17 - bulk, -4 + yy, 1, 1, '#000'); A(0, -15 - bulk, -4 + yy, 1, 1, '#000');
    A(1, 1, -11 + yy, 5, 4, P.gloveD);
    A(2, -8, -12 + yy, 6, 5, gl);
  } else {
    let b = 0, lean = 0, legA = 0;
    if (st === 'idle' || st === 'block' || st === 'win') b = (t >> 4) & 1;
    if (st === 'walk') { const ph = (t >> 3) & 3; legA = [0, 2, 0, -2][ph]; b = ph & 1; }
    let fg = { x:8, y:-36, w:6, h:7 }, bg = { x:3, y:-39, w:6, h:6 }, arm = [{ x:4, y:-32, w:5, h:3 }];
    if (st === 'atk') {
      const m = MOVES[f.move], s0 = f.mStart, s1 = s0 + m.active, ph = t < s0 ? 0 : t < s1 ? 1 : 2;
      if (f.move === 'jab') {
        if (ph === 0) { fg = { x:6, y:-36, w:6, h:7 }; arm = [{ x:3, y:-32, w:4, h:3 }]; lean = -1; }
        else if (ph === 1) { fg = { x:18, y:-37, w:7, h:6 }; arm = [{ x:4, y:-35, w:15, h:3 }]; lean = 1; }
        else { fg = { x:12, y:-36, w:6, h:7 }; arm = [{ x:4, y:-34, w:9, h:3 }]; }
      } else if (f.move === 'hook') {
        if (ph === 0) { fg = { x:-1, y:-28, w:6, h:7 }; arm = [{ x:1, y:-30, w:4, h:3 }]; lean = -2; b = 1; }
        else if (ph === 1) { fg = { x:11, y:-49, w:7, h:7 }; arm = [{ x:6, y:-34, w:4, h:4 }, { x:9, y:-43, w:3, h:7 }]; lean = 2; }
        else { fg = { x:10, y:-42, w:6, h:7 }; arm = [{ x:5, y:-34, w:5, h:4 }]; lean = 1; }
      } else {
        if (ph === 0) { fg = { x:-6, y:-25, w:7, h:7 }; arm = [{ x:-2, y:-29, w:4, h:4 }]; lean = -2; b = 3; gl = (t >> 1) & 1 ? '#fcfcfc' : P.gloves; }
        else if (ph === 1) { fg = { x:9, y:-59, w:8, h:9 }; arm = [{ x:6, y:-36, w:4, h:6 }, { x:9, y:-50, w:4, h:14 }]; lean = 3; gl = '#f8d878'; }
        else { fg = { x:10, y:-46, w:7, h:7 }; arm = [{ x:6, y:-36, w:4, h:6 }, { x:9, y:-40, w:3, h:4 }]; lean = 2; }
      }
      if (!f.isPlayer && ph === 0 && (t >> 2) & 1) gl = '#fcfcfc';
    }
    if (st === 'block') { fg = { x:7, y:-41, w:6, h:8 }; bg = { x:5, y:-47, w:6, h:6 }; arm = [{ x:4, y:-33, w:5, h:3 }]; lean = -1; }
    if (st === 'hit') { lean = -3; fg = { x:5, y:-31, w:6, h:7 }; bg = { x:-1, y:-36, w:6, h:6 }; arm = [{ x:2, y:-30, w:4, h:3 }]; }
    if (st === 'win') { fg = { x:-1, y:-62, w:7, h:7 }; arm = [{ x:0, y:-55, w:3, h:22 }]; bg = { x:3, y:-38, w:6, h:6 }; }
    // legs and shoes
    A(0, -5 - legA, -14 + b, 4, 11 - b, P.skin); A(0, 1 + legA, -14 + b, 4, 11 - b, P.skin);
    A(0, -6 - legA, -3, 6, 3, P.shoes); A(0, 1 + legA, -3, 6, 3, P.shoes);
    // trunks
    const tl = lean >> 1;
    A(0, -6 - bulk + tl, -21 + b, 12 + bulk * 2, 8, P.trunks); A(0, -6 - bulk + tl, -21 + b, 12 + bulk * 2, 2, P.belt);
    A(0, 4 + bulk + tl, -19 + b, 1, 6, P.belt);
    // torso
    A(0, -5 - bulk + lean, -32 + b, 11 + bulk * 2, 11, P.skin);
    A(0, -5 - bulk + lean, -32 + b, 2, 11, P.shade);
    A(0, 1 + lean, -28 + b, 4 + bulk, 1, P.shade);
    // head
    const hx = -3 + lean + (st === 'hit' ? -1 : 0), hy = -43 + b + (st === 'hit' ? 1 : 0);
    A(0, hx + 3, hy + 8, 3, 3, P.skin);
    A(0, hx, hy, 9, 9, P.skin);
    if (P.hair) { A(0, hx, hy, 9, 3, P.hair); A(0, hx, hy, 3, 6, P.hair); }
    if (P.band) A(0, hx, hy + 3, 9, 2, P.band);
    A(0, hx + 9, hy + 4, 1, 2, P.skin);
    A(0, hx + 5, hy + 4, 2, 2, '#fcfcfc'); A(0, hx + 6, hy + 4, 1, 2, '#000');
    if (st === 'hit') A(0, hx + 5, hy + 4, 2, 2, '#000');
    A(0, hx + 6, hy + 7, 3, 1, P.shade);
    if (P.stache) A(0, hx + 5, hy + 6, 5, 1, P.stache);
    A(1, bg.x + lean, bg.y + b, bg.w, bg.h, P.gloveD);
    for (const r of arm) A(2, r.x + lean, r.y + b, r.w, r.h, P.skin);
    A(2, fg.x + lean, fg.y + b, fg.w, fg.h, gl);
    A(2, fg.x + lean + 1, fg.y + b + 1, 2, 1, '#fcfcfc');
    if (!f.isPlayer && st === 'atk' && f.move === 'hook' && t < f.mStart) { A(2, -1, -54, 2, 5, '#f8b800'); A(2, -1, -47, 2, 2, '#f8b800'); }
  }
  const white = f.flashT > 0;
  for (const layer of L) {
    ctx.fillStyle = '#000';
    for (const r of layer) ctx.fillRect((s > 0 ? X + r[0] : X - r[0] - r[2]) - 1, Y + r[1] - 1, r[2] + 2, r[3] + 2);
    for (const r of layer) { ctx.fillStyle = white ? '#fcfcfc' : r[4]; ctx.fillRect(s > 0 ? X + r[0] : X - r[0] - r[2], Y + r[1], r[2], r[3]); }
  }
}

/* ---------- combat ---------- */
function stepFighter(f){
  f.t++;
  if (f.invul > 0) f.invul--;
  if (f.cool > 0) f.cool--;
  if (f.flashT > 0) f.flashT--;
  if (f.state === 'air') {
    f.x += f.vx; f.vy += 0.25; f.z += f.vy;
    if (f.z >= 0) { f.z = 0; f.state = 'down'; f.t = 0; f.vx = 0; shake(4); sfx.thud(); dust(f.x, f.y); }
    return;
  }
  f.x += f.vx; f.vx *= 0.8; if (Math.abs(f.vx) < 0.05) f.vx = 0;
  if (f.state === 'atk') {
    const m = MOVES[f.move];
    if (f.t >= f.mStart && f.t < f.mStart + m.active && !f.hitDone) tryHit(f);
    if (f.t >= f.mStart + m.active + m.rec) setState(f, 'idle');
  } else if (f.state === 'hit') {
    if (f.t >= f.stun) setState(f, 'idle');
  } else if (f.state === 'down') {
    if (f.t >= f.downTime) {
      if (f.hp > 0) { setState(f, 'idle'); f.invul = f.isPlayer ? 60 : 30; }
      else if (!f.isPlayer) f.dead = true;
    }
  }
}
function vulnerable(t){ return !t.dead && t.state !== 'air' && t.state !== 'down' && t.invul <= 0 && t.state !== 'win'; }
function tryHit(a){
  const m = MOVES[a.move];
  const pool = a.isPlayer ? enemies : [player];
  let best = null, bd = 1e9;
  for (const t of pool) {
    if (!vulnerable(t) || Math.abs(t.y - a.y) > 7) continue;
    const dx = (t.x - a.x) * a.face;
    if (dx < -2 || dx > m.reach + t.bulk) continue;
    if (dx < bd) { bd = dx; best = t; }
  }
  if (best) { a.hitDone = true; landHit(a, best, m); return; }
  if (!a.isPlayer) return;
  for (const pr of props) {
    if (pr.dead || Math.abs(pr.y - a.y) > 9) continue;
    const dx = (pr.x - a.x) * a.face;
    if (dx < -2 || dx > m.reach + 6) continue;
    a.hitDone = true; hitProp(a, pr, m); return;
  }
}
function hitProp(a, pr, m){
  pr.hp -= Math.round(m.dmg * a.power); pr.shakeT = 8; hitstop = 2;
  sparks.push({ x: pr.x - a.face * 6, y: pr.y - 10, life: 5, big: false, c: '#fcfcfc' });
  if (pr.hp > 0) { sfx.thunk(); return; }
  pr.dead = true; sfx.crash(); shake(3); score += 50;
  const cols = pr.kind === 'can' ? ['#bcbcbc', '#7c7c7c'] : pr.kind === 'barrel' ? ['#c84c0c', '#7c7c7c'] : ['#ac7c00', '#7c4c1c'];
  for (let i = 0; i < 12; i++) parts.push({ x: pr.x, y: pr.y - 8, vx: (Math.random() * 2 - 1) * 2.2 + a.face, vy: -Math.random() * 3 - 1, life: 32, c: cols[i & 1], g: 0.18 });
  // random loot: cash, food, or both
  const r = Math.random();
  if (r < 0.6) dropCash(pr.x, pr.y, Math.random() < 0.12 ? 100 : 5 * (2 + (Math.random() * 9 | 0)));
  if (r > 0.42) dropFood(pr.x + 6, pr.y);
}

/* ---------- enemy AI ---------- */
function enemyAI(e){
  const T = e.type, dx = player.x - e.x, dist = Math.abs(dx);
  const pDown = player.state === 'down' || player.state === 'air';
  if (!['idle','walk','block'].includes(e.state)) return;
  if (!pDown) e.face = dx >= 0 ? 1 : -1;
  if (e.state === 'block') { if (e.t > (e.blockT || 24)) setState(e, 'idle'); return; }
  const dy = player.y - e.y;
  if (player.state === 'atk' && player.t === 1 && dist < 34 && Math.abs(dy) < 8 && e.attacker && Math.random() < T.block * (1 + stageIdx * 0.2)) {
    setState(e, 'block'); e.blockT = 20 + (Math.random() * 16 | 0); return;
  }
  let want = e.attacker ? 20 : 54 + e.slot * 16;
  if (pDown) want = 62;
  const sp = T.speed;
  // line up on the player's depth; waiting enemies hover above or below
  const wantY = e.attacker && !pDown ? player.y : clamp(player.y + (e.slot & 1 ? -16 : 16), Y_MIN, Y_MAX);
  let moving = false;
  if (Math.abs(wantY - e.y) > 1.5) { e.y += Math.sign(wantY - e.y) * sp * 0.6; moving = true; }
  if (dist > want + 3) { e.x += Math.sign(dx) * sp; moving = true; }
  else if (dist < want - 3) { e.x -= Math.sign(dx) * sp * 0.6; moving = true; }
  setState(e, moving ? 'walk' : 'idle');
  const diff = 1 + stageIdx * 0.3;
  if (e.attacker && !pDown && dist < 28 && Math.abs(dy) < 5 && e.cool <= 0 && Math.random() < T.aggro * diff) {
    startMove(e, T.moves[Math.random() * T.moves.length | 0]);
    e.cool = (30 + Math.random() * 50) / diff;
  }
}

/* ---------- game flow ---------- */
function newGame(){ score = 0; money = 0; lives = 3; player = makePlayer(); applyUpgrades(player); startStage(0); }
function startStage(i){
  stageIdx = i; stage = STAGES[i]; build(stage);
  camX = 0; locked = false; waveIdx = 0; enemies = []; sparks = []; parts = []; floats = []; focusEnemy = null; banner = null;
  Object.assign(player, { x:60, y:200, z:0, vx:0, vy:0, face:1, state:'idle', t:0, invul:0, queued:null, combo:0 });
  player.stars = Math.max(player.stars, player.up.stars);
  pickups = []; props = [];
  const kinds = PROP_KINDS[stage.bg];
  for (let x = 150 + Math.random() * 60; x < stage.len - 140; x += 90 + Math.random() * 90) {
    const kind = kinds[Math.random() * kinds.length | 0], [lo, hi] = PROP_HP[kind];
    const hp = lo + (Math.random() * (hi - lo + 1) | 0);
    props.push({ kind, x, y: Y_MIN + 2 + Math.random() * (Y_MAX - Y_MIN - 4), hp, maxHp: hp, shakeT: 0, dead: false });
  }
  state = 'intro'; timer = 0; stopSong();
}
function spawnWave(w){
  locked = true; lockX = clamp(w.at - 80, 0, stage.len - W);
  w.foes.forEach((k, i) => {
    const right = i % 2 === 0;
    const x = right ? lockX + W + 20 + (i >> 1) * 30 : lockX - 20 - (i >> 1) * 30;
    enemies.push(makeEnemy(k, x));
  });
  const boss = enemies.find(e => e.type.boss);
  if (boss) { banner = { s: boss.type.name, life: 120 }; focusEnemy = boss; playSong(2); }
}
function revive(){
  lives--; Object.assign(player, { hp: player.maxHp, state:'idle', t:0, z:0, invul:120, combo:0 });
  for (const e of enemies) if (vulnerable(e)) { e.vx = Math.sign(e.x - player.x || 1) * 6; setState(e, 'hit'); e.stun = 30; }
  sfx.bell(); playSong(enemies.some(e => e.type.boss) ? 2 : stage.song);
}

function update(){
  frameN++;
  if (crowdHype > 0) crowdHype--;
  if (pressed.mute) { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.22; }
  if (state === 'title') {
    camX += 0.3; if (camX > stage.len - W) camX = 0;
    if (pressed.start || pressed.jab) newGame();
    return;
  }
  if (state === 'gameover') {
    timer++;
    if (timer > 60 && (pressed.start || pressed.jab)) { lives = 3; player.hp = player.maxHp; player.stars = 0; score = Math.floor(score / 2); startStage(stageIdx); }
    return;
  }
  if (state === 'victory') {
    timer++; crowdHype = 30;
    if (frameN % 3 === 0) parts.push({ x: camX + Math.random() * W, y: 30, vx: Math.random() - 0.5, vy: 0.4, life: 200, c: ['#e40058','#f8b800','#0058f8','#58f898','#fcfcfc'][Math.random() * 5 | 0], g: 0.01 });
    stepParts(); player.t++;
    if (timer > 120 && (pressed.start || pressed.jab)) { state = 'title'; stage = STAGES[2]; build(stage); camX = 0; stopSong(); }
    return;
  }
  if (pressed.pause && (state === 'play')) { paused = !paused; sfx.pause(); if (paused) stopSong(); else playSong(enemies.some(e => e.type.boss) ? 2 : stage.song); }
  if (paused) return;

  if (state === 'intro') {
    timer++;
    if (timer === 70) sfx.bell();
    if (timer >= 130) { state = 'play'; pop(player.x + 50, 110, 'FIGHT!', '#f8b800'); playSong(stage.song); }
    return;
  }
  if (state === 'clear') {
    timer++; player.t++; stepParts();
    if (timer === 50) { const bonus = player.hp * 20; score += bonus; pop(player.x, 120, 'HP BONUS ' + bonus, '#58f898'); }
    if (timer >= 240) {
      if (stageIdx < STAGES.length - 1) { player.hp = Math.min(player.maxHp, player.hp + 50); state = 'shop'; shopSel = 0; shopMsg = null; timer = 0; playSong(0); }
      else { saveHi(); state = 'victory'; timer = 0; player.state = 'win'; player.t = 0; camX = clamp(player.x - W / 2, 0, stage.len - W); }
    }
    return;
  }
  if (state === 'shop') { updateShop(); return; }
  // ---- play ----
  if (hitstop > 0) { hitstop--; stepFX(); return; }
  const p = player;
  if (['idle','walk','block'].includes(p.state)) {
    const q = p.queued; p.queued = null;
    if ((pressed.star || q === 'star') && p.stars > 0) { p.stars--; startMove(p, 'star'); sfx.star(); }
    else if (pressed.hook || q === 'hook') startMove(p, 'hook');
    else if (pressed.jab || q === 'jab') startMove(p, 'jab');
    else if (held.block) { setState(p, 'block'); }
    else {
      const mv = (held.right ? 1 : 0) - (held.left ? 1 : 0), mvy = (held.down ? 1 : 0) - (held.up ? 1 : 0);
      if (mv || mvy) {
        const k = mv && mvy ? 0.75 : 1;
        p.x += mv * p.speed * k; p.y = clamp(p.y + mvy * p.speed * 0.7 * k, Y_MIN, Y_MAX); setState(p, 'walk');
        let near = null, nd = 64;
        for (const e of enemies) if (vulnerable(e) && Math.abs(e.x - p.x) < nd && Math.abs(e.y - p.y) < 24) { nd = Math.abs(e.x - p.x); near = e; }
        p.face = near ? Math.sign(near.x - p.x) || p.face : mv || p.face;
      } else setState(p, 'idle');
    }
  } else if (p.state === 'atk') {
    const m = MOVES[p.move];
    if (p.t >= p.mStart + m.active) { if (pressed.jab) p.queued = 'jab'; if (pressed.hook) p.queued = 'hook'; if (pressed.star) p.queued = 'star'; }
  }
  stepFighter(p);

  // attacker tokens: nearest enemy on each side of the player
  let nl = null, nr = null;
  const active = enemies.filter(e => !e.dead && e.state !== 'down' && e.state !== 'air');
  for (const e of active) {
    if (e.x < p.x) { if (!nl || e.x > nl.x) nl = e; } else { if (!nr || e.x < nr.x) nr = e; }
  }
  let slotL = 0, slotR = 0;
  for (const e of active.sort((a, b) => Math.abs(a.x - p.x) - Math.abs(b.x - p.x))) {
    e.attacker = e === nl || e === nr;
    e.slot = e.attacker ? 0 : (e.x < p.x ? slotL++ : slotR++);
  }
  for (const e of enemies) { enemyAI(e); stepFighter(e); }

  // separation
  for (const e of enemies) {
    if (!vulnerable(e) && e.state !== 'block') continue;
    if (p.state === 'down' || p.state === 'air') continue;
    const dx = e.x - p.x;
    if (Math.abs(dx) < 13 && Math.abs(e.y - p.y) < 6) { const push = (13 - Math.abs(dx)) / 2, d = Math.sign(dx) || 1; e.x += d * push; p.x -= d * push * 0.6; }
  }
  for (let i = 0; i < enemies.length; i++) for (let j = i + 1; j < enemies.length; j++) {
    const a = enemies[i], b = enemies[j]; if (!vulnerable(a) || !vulnerable(b)) continue;
    const dx = b.x - a.x; if (Math.abs(dx) < 14 && Math.abs(b.y - a.y) < 6) { const d = Math.sign(dx) || 1, push = (14 - Math.abs(dx)) / 2; a.x -= d * push; b.x += d * push; }
  }
  enemies = enemies.filter(e => !e.dead);
  if (focusEnemy && focusEnemy.dead) focusEnemy = enemies.find(e => e.type.boss) || null;

  // camera & waves
  const waves = stage.waves;
  if (!locked && waveIdx < waves.length && p.x >= waves[waveIdx].at) spawnWave(waves[waveIdx]);
  if (locked) camX += (lockX - camX) * 0.12;
  else { const target = clamp(p.x - 110, 0, stage.len - W); if (target > camX) camX += (target - camX) * 0.15; }
  p.x = clamp(p.x, camX + 10, Math.min(camX + W - 10, stage.len - 10));
  for (const e of enemies) {
    if (!e.entered && e.x > camX + 8 && e.x < camX + W - 8) e.entered = true;
    if (e.entered) e.x = clamp(e.x, camX + 8, camX + W - 8);
    e.y = clamp(e.y, Y_MIN, Y_MAX);
  }
  // loot: bounce out, then collect by walking over it
  for (const q of pickups) {
    q.life--;
    if (q.z < 0 || q.vz < 0) { q.x += q.vx; q.vz += 0.25; q.z += q.vz; if (q.z >= 0) { q.z = 0; q.vz = q.vz > 1 ? -q.vz * 0.35 : 0; q.vx *= 0.5; } }
    if (q.z > -2 && vulnerable(p) && Math.abs(q.x - p.x) < 12 && Math.abs(q.y - p.y) < 9) {
      q.life = 0;
      if (q.kind === 'cash') { money += q.val; sfx.coin(); pop(q.x, q.y - 30, '+$' + q.val, '#58f898'); }
      else { p.hp = Math.min(p.maxHp, p.hp + q.val); sfx.eat(); pop(q.x, q.y - 30, q.food.name + ' +' + q.val, '#f8b800'); }
    }
  }
  pickups = pickups.filter(q => q.life > 0);
  for (const pr of props) if (pr.shakeT > 0) pr.shakeT--;
  props = props.filter(pr => !pr.dead);
  if (locked && enemies.length === 0) {
    locked = false; waveIdx++;
    if (waveIdx >= waves.length) {
      state = 'clear'; timer = 0; p.state = 'win'; p.t = 0; stopSong(); sfx.fanfare(); saveHi();
      const loose = pickups.filter(q => q.kind === 'cash').reduce((sum, q) => sum + q.val, 0);
      if (loose) { money += loose; pop(p.x, p.y - 60, 'LOOT +$' + loose, '#58f898'); }
      pickups = [];
    }
    else { goT = 150; if (waves[waveIdx - 1].foes.some(k => TYPES[k].boss)) playSong(stage.song); }
  }
  if (goT > 0) goT--;
  if (banner && --banner.life <= 0) banner = null;

  // player KO
  if (p.hp <= 0 && p.state === 'down' && p.t >= p.downTime) {
    if (lives > 0) revive();
    else { state = 'gameover'; timer = 0; saveHi(); }
  }
  stepFX();
}
/* ---------- gym ---------- */
function upCost(u){ if (u.key === 'heal') return u.cost[0]; const lvl = player.up[u.key]; return lvl >= u.max ? null : u.cost[lvl]; }
function updateShop(){
  timer++; player.t++;
  const n = UPGRADES.length;
  if (pressed.up) { shopSel = (shopSel + n - 1) % n; sfx.tick(); shopMsg = null; }
  if (pressed.down) { shopSel = (shopSel + 1) % n; sfx.tick(); shopMsg = null; }
  const u = UPGRADES[shopSel];
  if (timer > 20 && (pressed.start || ((pressed.jab || pressed.hook) && u.key === 'leave'))) { startStage(stageIdx + 1); return; }
  if (!(pressed.jab || pressed.hook) || u.key === 'leave') return;
  const c = upCost(u);
  if (c == null) { shopMsg = ['MAXED OUT', '#7c7c7c']; sfx.nope(); }
  else if (u.key === 'heal' && player.hp >= player.maxHp) { shopMsg = ['HP IS ALREADY FULL', '#7c7c7c']; sfx.nope(); }
  else if (money < c) { shopMsg = ['NEED $' + (c - money) + ' MORE', '#e40058']; sfx.nope(); }
  else {
    money -= c; sfx.buy();
    if (u.key === 'heal') player.hp = player.maxHp;
    else { const oldMax = player.maxHp; player.up[u.key]++; applyUpgrades(player); player.hp += player.maxHp - oldMax; }
    shopMsg = [u.name + ' UP!', '#58f898'];
  }
}

    txt(u.name, 98, y, sel ? '#fcfcfc' : '#a4a4c4');
    if (u.max) for (let k = 0; k < u.max; k++) O(184 + k * 5, y + 2, 3, 4, k < player.up[u.key] ? '#f8b800' : '#3c3c3c');
    const c = u.key === 'leave' ? null : upCost(u);
    if (u.key !== 'leave') txt(c == null ? 'MAX' : '$' + c, 250, y, c == null ? '#7c7c7c' : money >= c ? '#58d854' : '#a81000', 'right');
  });
  const u = UPGRADES[shopSel];
  txt(u.info, 128, 180, '#a4e4fc', 'center');
  if (shopMsg) txt(shopMsg[0], 128, 194, shopMsg[1], 'center');
  txt('UP/DOWN PICK   JAB BUY', 128, 208, '#7c7c7c', 'center');
}
function drawSpark(s){
  const x = Math.round(s.x - camX), y = Math.round(s.y), r = s.big ? (s.life > 4 ? 11 : 7) : (s.life > 3 ? 7 : 4);
  const c = s.life & 1 ? s.c : '#f8d878';
  R(x - 1, y - r, 2, r * 2, c); R(x - r, y - 1, r * 2, 2, c);
  const d = (r * 0.65) | 0;
  for (let i = 2; i <= d; i++) { R(x + i, y + i, 1, 1, c); R(x - i, y + i, 1, 1, c); R(x + i, y - i, 1, 1, c); R(x - i, y - i, 1, 1, c); }
}
function bar(x, y, segs, frac, col, rtl){
  R(x - 1, y - 1, segs * 4 + 1, 8, '#000');
  const n = Math.ceil(frac * segs);
  for (let i = 0; i < segs; i++) {
    const on = rtl ? i >= segs - n : i < n;
    R(x + i * 4, y, 3, 6, on ? col : '#3c3c3c');
    if (on) R(x + i * 4, y, 3, 1, '#fcfcfc');
  }
}
function drawHUD(){
  R(0, 0, W, 28, '#000'); R(0, 27, W, 1, '#3c3c3c');
  const p = player, low = p.hp / p.maxHp < 0.3;
  txt('1P', 6, 4, '#f8b800');
  bar(26, 4, 20, p.hp / p.maxHp, low && (frameN >> 3) & 1 ? '#e40058' : '#58d854');
  for (let i = 0; i < 3; i++) starIcon(26 + i * 10, 15, i < p.stars ? ((frameN >> 3) & 1 ? '#f8d878' : '#f8b800') : '#3c3c3c');
  R(6, 16, 5, 5, PLAYER_PAL.skin); R(6, 16, 5, 2, PLAYER_PAL.hair); txt(String(lives), 13, 15, '#fcfcfc');
  txt('$' + money, 60, 15, '#58d854');
  txt(String(score).padStart(6, '0'), 128, 15, '#fcfcfc', 'center');
  const fe = focusEnemy && !focusEnemy.dead ? focusEnemy : enemies.find(e => !e.dead);
  if (fe) { txt(fe.type.name, 250, 4, fe.type.boss ? '#e40058' : '#fca044', 'right'); bar(170, 15, 20, fe.hp / fe.maxHp, '#fca044', true); }
  else txt('HI ' + String(Math.max(hiscore, score)).padStart(6, '0'), 250, 4, '#7c7c7c', 'right');
}
function overlayCard(lines){
  ctx.fillStyle = 'rgba(0,0,0,.72)'; ctx.fillRect(0, 76, W, 72);
  R(0, 76, W, 1, '#f8b800'); R(0, 147, W, 1, '#f8b800');
  lines.forEach(([s, c, size], i) => txt(s, 128, 86 + i * 18, c, 'center', size || 8));
}
function render(){
  if (state === 'shop') { drawShop(); return; }
  ctx.save();
  if (shakeT > 0) ctx.translate((Math.random() * 2 - 1) * shakeMag | 0, (Math.random() * 2 - 1) * shakeMag | 0);
  drawBackground(state === 'title');

  if (state === 'title') {
    const demo = [
      makeFighter({ x: camX + 104, face: 1, pal: PLAYER_PAL, t: frameN, state: (frameN % 90) < 12 ? 'atk' : 'idle', move:'jab', mStart:3, isPlayer:true }),
      makeFighter({ x: camX + 152, face: -1, pal: TYPES.boss3.pal, bulk: 3, t: frameN, state: (frameN % 90) >= 12 && (frameN % 90) < 34 ? 'block' : 'idle', isPlayer:true })
    ];
    if (demo[0].state === 'atk') demo[0].t = frameN % 90;
    demo.forEach(drawBoxer);
    drawForeground();
    ctx.restore();
    R(0, 0, W, 28, '#000');
    txt('KNOCKOUT', 128, 46, '#f8b800', 'center', 16, '#a80020');
    txt('ALLEY', 128, 66, '#fcfcfc', 'center', 16, '#a80020');
    txt('STREET  BOXING  CHAMPIONSHIP', 128, 90, '#a4e4fc', 'center');
    if ((frameN >> 5) & 1) txt('PRESS START', 128, 112, '#fcfcfc', 'center');
    txt('HI ' + String(hiscore).padStart(6, '0'), 128, 10, '#f8b800', 'center');
    return;
  }

  const scene = [];
  for (const pr of props) scene.push([pr.y - 0.5, () => drawProp(pr)]);
  for (const q of pickups) scene.push([q.y - 1, () => drawPickup(q)]);
  for (const e of enemies) scene.push([e.y - (e.state === 'down' ? 6 : 0), () => drawBoxer(e)]);
  scene.push([player.y + 0.1, () => drawBoxer(player)]);
  scene.sort((a, b) => a[0] - b[0]).forEach(d => d[1]());
  for (const s of sparks) drawSpark(s);
  for (const q of parts) R(Math.round(q.x - camX), Math.round(q.y), 2, 2, q.c);
  drawForeground();
  for (const f of floats) txt(f.s, Math.round(f.x - camX), Math.round(f.y), f.c, 'center');
  ctx.restore();
  drawHUD();

  if (goT > 0 && (goT >> 4) & 1) { txt('GO', 214, 96, '#f8b800'); R(232, 98, 6, 4, '#f8b800'); R(238, 96, 2, 8, '#f8b800'); R(240, 97, 2, 6, '#f8b800'); R(242, 98, 2, 4, '#f8b800'); }
  if (banner) { const y = 40; ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(0, y, W, 30); txt('VS.', 128, y + 4, '#e40058', 'center'); txt(banner.s, 128, y + 16, '#fcfcfc', 'center'); }
  if (state === 'intro') overlayCard([['STAGE ' + (stageIdx + 1), '#f8b800', 16], [stage.name, '#fcfcfc'], [stage.sub, '#a4e4fc']]);
  if (state === 'clear' && timer > 20) overlayCard([[stageIdx < 2 ? 'STAGE CLEAR!' : 'TITLE WON!', '#f8b800', 16], ['SCORE ' + String(score).padStart(6, '0'), '#fcfcfc'], [stageIdx < 2 ? 'NEXT: THE GYM' : '', '#a4e4fc']]);
  if (state === 'gameover') overlayCard([['GAME OVER', '#e40058', 16], ['SCORE ' + String(score).padStart(6, '0'), '#fcfcfc'], [timer > 60 && (frameN >> 5) & 1 ? 'PRESS START TO CONTINUE' : '', '#a4e4fc']]);
  if (state === 'victory') overlayCard([['NEW CHAMPION!', '#f8b800', 16], ['FINAL ' + String(score).padStart(6, '0'), '#fcfcfc'], [timer > 120 && (frameN >> 5) & 1 ? 'PRESS START' : 'THE BELT IS YOURS', '#a4e4fc']]);
  if (paused) overlayCard([['PAUSE', '#fcfcfc', 16], ['P TO RESUME', '#a4e4fc']]);
  if (muted) txt('SOUND OFF', 250, 214, '#7c7c7c', 'right');
}

/* ---------- loop ---------- */
stage = STAGES[2]; build(stage); player = makePlayer();
let acc = 0, last = performance.now();
const STEP = 1000 / 60;
function frame(now){
  acc += Math.min(100, now - last); last = now;
  let ran = false;
  while (acc >= STEP) { update(); acc -= STEP; if (!ran) { for (const k in pressed) pressed[k] = false; ran = true; } }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
